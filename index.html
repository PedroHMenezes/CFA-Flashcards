function Create({ addCard, updateCard, editingCard, setEditingCard, setView, showToast }) {
  const isEdit = !!editingCard;
  const [form, setForm] = useState(() => editingCard ? {
    question: editingCard.question,
    answer: editingCard.answer,
    topic: editingCard.topic,
    subtopic: editingCard.subtopic || '',
    difficulty: editingCard.difficulty || 'Medium',
    tags: (editingCard.tags || []).join(', '),
    notes: editingCard.notes || '',
    priority: !!editingCard.priority,
  } : {
    question: '', answer: '', topic: TOPICS[0],
    subtopic: '', difficulty: 'Medium', tags: '', notes: '',
    priority: false,
  });
  const [bulkText, setBulkText] = useState('');
  const [mode, setMode] = useState('single'); // single | bulk | notes

  // Formula builder state — tracks which textarea has the open panel and the refs to each
  const [formulaTarget, setFormulaTarget] = useState(null); // 'question' | 'answer' | 'notes' | null
  const fieldRefs = useRef({ question: null, answer: null, notes: null });

  const insertAtCursor = (field, text) => {
    const el = fieldRefs.current[field];
    if (!el) { setForm(f => ({ ...f, [field]: (f[field] || '') + text })); return; }
    const start = el.selectionStart ?? el.value.length;
    const end = el.selectionEnd ?? el.value.length;
    const current = form[field] || '';
    const next = current.slice(0, start) + text + current.slice(end);
    setForm(f => ({ ...f, [field]: next }));
    // Restore caret after React commits the new value
    requestAnimationFrame(() => {
      if (el && document.activeElement !== el) el.focus();
      if (el) {
        const newPos = start + text.length;
        el.setSelectionRange(newPos, newPos);
      }
    });
  };

  const submit = (createAnother = false) => {
    if (!form.question.trim() || !form.answer.trim()) {
      showToast('Question and answer are required', 'error');
      return;
    }
    const data = {
      ...form,
      tags: form.tags.split(',').map(t => t.trim()).filter(Boolean),
    };
    if (isEdit) {
      updateCard(editingCard.id, data);
      showToast('Card updated');
      setEditingCard(null);
      setView('browse');
    } else {
      addCard(data);
      showToast('Card created');
      if (createAnother) {
        setForm({ ...form, question: '', answer: '', tags: form.tags, notes: '' });
      } else {
        setView('browse');
      }
    }
  };

  const handleBulkImport = () => {
    const text = bulkText.trim();
    if (!text) return;
    let created = 0;
    // Try parsing as "Q :: A" lines, or "Q|A", or "Q\tA"
    const lines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
    for (const line of lines) {
      let parts;
      if (line.includes('::')) parts = line.split('::');
      else if (line.includes('|')) parts = line.split('|');
      else if (line.includes('\t')) parts = line.split('\t');
      else continue;
      const [q, a, ...rest] = parts;
      if (!q || !a) continue;
      addCard({
        question: q.trim(),
        answer: a.trim(),
        topic: form.topic,
        subtopic: form.subtopic,
        difficulty: form.difficulty,
        tags: form.tags.split(',').map(t => t.trim()).filter(Boolean),
        notes: rest.join('::').trim(),
        priority: form.priority,
      });
      created++;
    }
    showToast(`Created ${created} cards`);
    setBulkText('');
    if (created > 0) setView('browse');
  };

  return (
    <div className="fade-in max-w-3xl mx-auto space-y-4">
      <div className="flex items-center justify-between">
        <h1 className="font-serif text-3xl md:text-4xl font-medium">{isEdit ? 'Edit card' : 'New card'}</h1>
        {!isEdit && (
          <div className="flex gap-1 bg-paper-2 dark:bg-ink/40 p-1 rounded-md">
            <button onClick={() => setMode('single')} className={`px-3 py-1.5 rounded text-xs font-medium transition ${mode === 'single' ? 'bg-paper dark:bg-ink-soft' : 'text-ink/60 dark:text-paper/60'}`}>Single</button>
            <button onClick={() => setMode('bulk')} className={`px-3 py-1.5 rounded text-xs font-medium transition ${mode === 'bulk' ? 'bg-paper dark:bg-ink-soft' : 'text-ink/60 dark:text-paper/60'}`}>Bulk paste</button>
            <button onClick={() => setMode('notes')} className={`px-3 py-1.5 rounded text-xs font-medium transition ${mode === 'notes' ? 'bg-paper dark:bg-ink-soft' : 'text-ink/60 dark:text-paper/60'}`}>Notes → cards</button>
          </div>
        )}
      </div>

      <Card className="p-5 space-y-4">
        {mode === 'single' ? (
          <>
            <div>
              <div className="flex items-center justify-between mb-1.5">
                <label className="block text-xs uppercase tracking-widest text-ink/55 dark:text-paper/55 font-medium">Question / Front</label>
                <button type="button"
                  onClick={() => setFormulaTarget(formulaTarget === 'question' ? null : 'question')}
                  className={`text-xs px-2 py-1 rounded font-medium transition flex items-center gap-1.5 ${formulaTarget === 'question' ? 'bg-rust/10 text-rust' : 'text-ink/55 dark:text-paper/55 hover:text-ink dark:hover:text-paper hover:bg-paper-2 dark:hover:bg-ink/40'}`}
                  title="Insert Greek letters, math symbols, or a formula template">
                  <span className="font-serif italic">ƒ</span>Σ Formula
                </button>
              </div>
              <Textarea
                ref={(el) => { fieldRefs.current.question = el; }}
                rows={3}
                placeholder="e.g. Define mean-variance optimization and list two weaknesses."
                value={form.question}
                onChange={(e) => setForm(f => ({ ...f, question: e.target.value }))}
                autoFocus
              />
              {formulaTarget === 'question' && (
                <FormulaBuilder
                  onInsert={(t) => insertAtCursor('question', t)}
                  onClose={() => setFormulaTarget(null)}
                />
              )}
            </div>
            <div>
              <div className="flex items-center justify-between mb-1.5">
                <label className="block text-xs uppercase tracking-widest text-ink/55 dark:text-paper/55 font-medium">Answer / Back</label>
                <button type="button"
                  onClick={() => setFormulaTarget(formulaTarget === 'answer' ? null : 'answer')}
                  className={`text-xs px-2 py-1 rounded font-medium transition flex items-center gap-1.5 ${formulaTarget === 'answer' ? 'bg-rust/10 text-rust' : 'text-ink/55 dark:text-paper/55 hover:text-ink dark:hover:text-paper hover:bg-paper-2 dark:hover:bg-ink/40'}`}
                  title="Insert Greek letters, math symbols, or a formula template">
                  <span className="font-serif italic">ƒ</span>Σ Formula
                </button>
              </div>
              <Textarea
                ref={(el) => { fieldRefs.current.answer = el; }}
                rows={5}
                placeholder="Be specific. Use line breaks for steps. Markdown not rendered — keep it plain."
                value={form.answer}
                onChange={(e) => setForm(f => ({ ...f, answer: e.target.value }))}
              />
              {formulaTarget === 'answer' && (
                <FormulaBuilder
                  onInsert={(t) => insertAtCursor('answer', t)}
                  onClose={() => setFormulaTarget(null)}
                />
              )}
            </div>
            <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
              <div>
                <label className="block text-xs uppercase tracking-widest text-ink/55 dark:text-paper/55 mb-1.5 font-medium">Topic</label>
                <Select value={form.topic} onChange={(v) => setForm(f => ({ ...f, topic: v }))} options={TOPICS} className="w-full" />
              </div>
              <div>
                <label className="block text-xs uppercase tracking-widest text-ink/55 dark:text-paper/55 mb-1.5 font-medium">Subtopic</label>
                <Input value={form.subtopic} onChange={(e) => setForm(f => ({ ...f, subtopic: e.target.value }))} placeholder="optional" />
              </div>
              <div>
                <label className="block text-xs uppercase tracking-widest text-ink/55 dark:text-paper/55 mb-1.5 font-medium">Difficulty</label>
                <Select value={form.difficulty} onChange={(v) => setForm(f => ({ ...f, difficulty: v }))} options={DIFFICULTIES} className="w-full" />
              </div>
            </div>
            <div>
              <label className="block text-xs uppercase tracking-widest text-ink/55 dark:text-paper/55 mb-1.5 font-medium">Tags <span className="opacity-50 normal-case tracking-normal">(comma-separated)</span></label>
              <Input value={form.tags} onChange={(e) => setForm(f => ({ ...f, tags: e.target.value }))} placeholder="e.g. ips, mnemonic, standards" />
            </div>
            <div>
              <div className="flex items-center justify-between mb-1.5">
                <label className="block text-xs uppercase tracking-widest text-ink/55 dark:text-paper/55 font-medium">Notes <span className="opacity-50 normal-case tracking-normal">(optional)</span></label>
                <button type="button"
                  onClick={() => setFormulaTarget(formulaTarget === 'notes' ? null : 'notes')}
                  className={`text-xs px-2 py-1 rounded font-medium transition flex items-center gap-1.5 ${formulaTarget === 'notes' ? 'bg-rust/10 text-rust' : 'text-ink/55 dark:text-paper/55 hover:text-ink dark:hover:text-paper hover:bg-paper-2 dark:hover:bg-ink/40'}`}
                  title="Insert Greek letters, math symbols, or a formula template">
                  <span className="font-serif italic">ƒ</span>Σ Formula
                </button>
              </div>
              <Textarea
                ref={(el) => { fieldRefs.current.notes = el; }}
                rows={2}
                value={form.notes}
                onChange={(e) => setForm(f => ({ ...f, notes: e.target.value }))}
                placeholder="Extra context, page references, formula derivation…"
              />
              {formulaTarget === 'notes' && (
                <FormulaBuilder
                  onInsert={(t) => insertAtCursor('notes', t)}
                  onClose={() => setFormulaTarget(null)}
                />
              )}
            </div>
            <label className="flex items-center gap-2 cursor-pointer text-sm">
              <input
                type="checkbox"
                checked={form.priority}
                onChange={(e) => setForm(f => ({ ...f, priority: e.target.checked }))}
                className="w-4 h-4 accent-rust"
              />
              Mark as high priority
            </label>

            <div className="flex flex-wrap gap-2 pt-2 border-t border-ink/8 dark:border-paper/8">
              <Btn variant="rust" onClick={() => submit(false)}>{isEdit ? 'Save changes' : 'Create card'}</Btn>
              {!isEdit && <Btn variant="outline" onClick={() => submit(true)}>Create & add another</Btn>}
              <Btn variant="ghost" onClick={() => { setEditingCard(null); setView(isEdit ? 'browse' : 'dashboard'); }}>Cancel</Btn>
            </div>
          </>
        ) : mode === 'bulk' ? (
          <>
            <div>
              <label className="block text-xs uppercase tracking-widest text-ink/55 dark:text-paper/55 mb-1.5 font-medium">Bulk paste</label>
              <div className="text-xs text-ink/55 dark:text-paper/55 mb-2">
                One card per line. Format: <code className="bg-ink/5 dark:bg-paper/10 px-1 rounded">Question :: Answer</code> (also accepts <code className="bg-ink/5 dark:bg-paper/10 px-1 rounded">|</code> or tab as separator). All cards inherit the topic/difficulty/tags below.
              </div>
              <Textarea
                rows={12}
                placeholder={'What is duration? :: Sensitivity of price to a 1% yield change.\nDefine GIPS composite. :: An aggregation of portfolios with similar mandate.'}

                onChange={(e) => setBulkText(e.target.value)}
                className="font-mono text-sm"
              />
            </div>
            <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
              <div>
                <label className="block text-xs uppercase tracking-widest text-ink/55 dark:text-paper/55 mb-1.5 font-medium">Topic</label>
                <Select value={form.topic} onChange={(v) => setForm(f => ({ ...f, topic: v }))} options={TOPICS} className="w-full" />
              </div>
              <div>
                <label className="block text-xs uppercase tracking-widest text-ink/55 dark:text-paper/55 mb-1.5 font-medium">Difficulty</label>
                <Select value={form.difficulty} onChange={(v) => setForm(f => ({ ...f, difficulty: v }))} options={DIFFICULTIES} className="w-full" />
              </div>
              <div>
                <label className="block text-xs uppercase tracking-widest text-ink/55 dark:text-paper/55 mb-1.5 font-medium">Tags</label>
                <Input value={form.tags} onChange={(e) => setForm(f => ({ ...f, tags: e.target.value }))} placeholder="optional" />
              </div>
            </div>
            <div className="flex gap-2 pt-2 border-t border-ink/8 dark:border-paper/8">
              <Btn variant="rust" onClick={handleBulkImport}>Import cards</Btn>

            </div>
          </>
        ) : (
          <NotesToCards
            defaultTopic={form.topic} defaultDifficulty={form.difficulty} defaultTags={form.tags}

            onChangeDefaults={(patch) => setForm(f => ({ ...f, ...patch }))}
          />
        )}
      </Card>

  );
}

// ─────────────────────────────────────────────────────────────────────────────
// NOTES → CARDS
// Two-stage workflow:
//   1. User types/pastes free-form notes from mock-exam review or question
//      session. Click "Extract" → parser produces candidate cards.
//   2. Candidate list shown for review — each row editable, deletable, or has
//      its topic/difficulty/tags adjusted. Click "Add all" to commit.
// ─────────────────────────────────────────────────────────────────────────────

function NotesToCards({ defaultTopic, defaultDifficulty, defaultTags, addCard, setView, showToast, onChangeDefaults }) {
  const [text, setText] = useState('');
  const [candidates, setCandidates] = useState([]); // post-parse, pre-commit
  const [unparsed, setUnparsed] = useState([]);
  const [stage, setStage] = useState('input'); // 'input' | 'review'
  const [autoDetectTopic, setAutoDetectTopic] = useState(true);
  // Source context — defaults the user-friendly cases
  const [source, setSource] = useState('mock'); // 'mock' | 'practice' | 'reading'
  const [sourceDate, setSourceDate] = useState(todayKey());

  const sourceDefaults = useMemo(() => {
    if (source === 'mock') return { topic: 'Error Log', tags: ['mock-review', sourceDate], difficulty: 'Hard' };
    if (source === 'practice') return { topic: defaultTopic || 'Portfolio Management', tags: ['practice-q', sourceDate], difficulty: 'Medium' };
    return { topic: defaultTopic || 'Portfolio Management', tags: ['reading', sourceDate], difficulty: 'Medium' };
  }, [source, sourceDate, defaultTopic]);

  const handleExtract = () => {
    if (!text.trim()) {
      showToast('Type or paste your notes first', 'error');
      return;
    }
    const result = parseNotesToCards(text, {
      topic: sourceDefaults.topic,
      difficulty: sourceDefaults.difficulty,
      tags: sourceDefaults.tags,
      autoDetectTopic,
    });
    if (result.cards.length === 0) {
      showToast('Couldn\'t recognize any cards. Try adding "Q: ... A: ..." or "Question :: Answer" formatting.', 'error');
    }
    // Give each candidate a local id so the review UI can edit it
    const withIds = result.cards.map((c, i) => ({ ...c, _id: `cand-${i}-${Date.now()}`, _include: true }));
    setCandidates(withIds);
    setUnparsed(result.unparsed);
    setStage('review');
  };

  const updateCandidate = (id, patch) => {
    setCandidates(prev => prev.map(c => c._id === id ? { ...c, ...patch } : c));
  };

  const removeCandidate = (id) => {
    setCandidates(prev => prev.filter(c => c._id !== id));
  };

  const commitAll = () => {
    const included = candidates.filter(c => c._include !== false);
    if (included.length === 0) {
      showToast('Nothing to add — every candidate is excluded', 'error');
      return;
    }
    let created = 0;
    for (const c of included) {
      if (!c.question.trim() || !c.answer.trim()) continue;
      addCard({
        question: c.question,
        answer: c.answer,
        topic: c.topic,
        subtopic: c.subtopic || '',
        difficulty: c.difficulty,
        tags: Array.isArray(c.tags) ? c.tags : String(c.tags || '').split(',').map(s => s.trim()).filter(Boolean),
        notes: c.notes || '',
        priority: c.priority || false,
      });
      created++;
    }
    showToast(`Added ${created} card${created === 1 ? '' : 's'} from notes`);
    setText('');
    setCandidates([]);
    setUnparsed([]);
    setStage('input');
    if (created > 0) setView('browse');
  };

  const reset = () => {
    setCandidates([]);
    setUnparsed([]);
    setStage('input');
  };

  // Sample to help the user understand format
  const sampleNotes = `Mock 1, Q3 — confused liability-relative vs goals-based allocation.
Q: When should a manager use liability-relative asset allocation?
A: When the investor has defined obligations (DB pension, insurer, bank) and the goal is to fund them with high probability. Use surplus optimization or hedging/return-seeking split.

Topic: Behavioral Finance
Q: Define disposition effect.
A: Investors sell winners too early and hold losers too long. Driven by prospect theory and loss aversion. Causes tax inefficiency.

Macaulay duration :: weighted average time to receive bond cash flows
Modified duration :: Macaulay duration / (1 + y); approximates price sensitivity to yield`;

  return (
    <>
      {stage === 'input' ? (
        <>
          <div>
            <div className="flex items-center justify-between mb-1.5 flex-wrap gap-2">
              <label className="block text-xs uppercase tracking-widest text-ink/55 dark:text-paper/55 font-medium">
                Notes from mock or question session
              </label>
              <div className="text-xs text-ink/55 dark:text-paper/55">{text.length} chars · {text.split('\n').filter(l => l.trim()).length} non-empty lines</div>
            </div>
            <div className="text-xs text-ink/60 dark:text-paper/60 mb-2">
              Write or paste your conclusions in any of these formats. Each block separated by a blank line becomes a card.
            </div>
            <Textarea
              rows={14}
              placeholder={sampleNotes}
              value={text}
              onChange={(e) => setText(e.target.value)}
              className="font-mono text-[13px]"
            />
          </div>

          {/* Source context controls */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
            <div>
              <label className="block text-xs uppercase tracking-widest text-ink/55 dark:text-paper/55 mb-1.5 font-medium">Source</label>
              <Select value={source} onChange={setSource} options={[
                { value: 'mock', label: 'Mock-exam review' },
                { value: 'practice', label: 'Practice question session' },
                { value: 'reading', label: 'Curriculum reading' },
              ]} className="w-full" />
            </div>
            <div>
              <label className="block text-xs uppercase tracking-widest text-ink/55 dark:text-paper/55 mb-1.5 font-medium">Default topic</label>
              <Select value={defaultTopic} onChange={(v) => onChangeDefaults({ topic: v })} options={TOPICS} className="w-full" />
            </div>
            <div>
              <label className="block text-xs uppercase tracking-widest text-ink/55 dark:text-paper/55 mb-1.5 font-medium">Default difficulty</label>
              <Select value={defaultDifficulty} onChange={(v) => onChangeDefaults({ difficulty: v })} options={DIFFICULTIES} className="w-full" />
            </div>
          </div>

          <label className="flex items-center gap-2 text-sm cursor-pointer">
            <input type="checkbox" checked={autoDetectTopic} onChange={(e) => setAutoDetectTopic(e.target.checked)} className="w-4 h-4 accent-rust" />
            <span>Auto-detect topic from card content (e.g. "duration" → Fixed Income)</span>
          </label>

          {/* Format hints disclosure */}
          <details className="text-sm">
            <summary className="cursor-pointer text-ink/60 dark:text-paper/60 hover:text-ink dark:hover:text-paper text-xs uppercase tracking-widest font-medium">
              Supported formats
            </summary>
            <div className="mt-2 space-y-1.5 text-xs text-ink/65 dark:text-paper/65 pl-2 border-l-2 border-ink/10 dark:border-paper/10">
              <div><strong>Q: / A:</strong> — explicit prefix on separate lines. Most reliable.</div>
              <div><strong>Question :: Answer</strong> — one card per line, double-colon separator.</div>
              <div><strong>Question | Answer</strong> — pipe separator.</div>
              <div><strong>Inline arrow</strong> — <code className="bg-ink/5 dark:bg-paper/10 px-1 rounded">term → definition</code> or <code className="bg-ink/5 dark:bg-paper/10 px-1 rounded">term = definition</code></div>
              <div><strong>Question detection</strong> — a line ending with "?" becomes the front; lines below it become the back.</div>
              <div><strong>Heading: body</strong> — a line ending with ":" becomes the front; following lines become the back.</div>
              <div className="pt-1"><strong>Topic / Tags / Difficulty</strong> override — a line like <code className="bg-ink/5 dark:bg-paper/10 px-1 rounded">Topic: Fixed Income</code> at the top of a block applies to all cards in that block.</div>
              <div className="pt-1 text-ink/55 dark:text-paper/55">Blocks are separated by blank lines. Each block typically becomes one card (Q/A pairs) or multiple cards (one per line for ::, |, →).</div>
            </div>
          </details>

          <div className="flex gap-2 pt-2 border-t border-ink/8 dark:border-paper/8">
            <Btn variant="rust" onClick={handleExtract}>Extract cards →</Btn>
            <Btn variant="outline" onClick={() => setText(sampleNotes)}>Insert sample</Btn>
            <div className="flex-1" />
            <Btn variant="ghost" onClick={() => setView('dashboard')}>Cancel</Btn>
          </div>
        </>
      ) : (
        // Review stage
        <>
          <div className="flex items-center justify-between flex-wrap gap-3">
            <div>
              <div className="font-serif text-xl font-medium">
                {candidates.length} {candidates.length === 1 ? 'card' : 'cards'} ready to add
              </div>
              <div className="text-sm text-ink/60 dark:text-paper/60">
                Review, edit, or remove. Then click "Add all" to commit.
                {unparsed.length > 0 && <span className="text-ochre"> · {unparsed.length} block{unparsed.length === 1 ? '' : 's'} couldn't be parsed.</span>}
              </div>
            </div>
            <div className="flex gap-2">
              <Btn variant="outline" onClick={reset}>← Back to notes</Btn>
              <Btn variant="rust" onClick={commitAll} disabled={candidates.filter(c => c._include !== false).length === 0}>
                Add {candidates.filter(c => c._include !== false).length} card{candidates.filter(c => c._include !== false).length === 1 ? '' : 's'}
              </Btn>
            </div>
          </div>

          {/* Unparsed warnings */}
          {unparsed.length > 0 && (
            <Card className="p-4 border-ochre/30 bg-ochre/5">
              <div className="text-xs uppercase tracking-widest text-ochre font-medium mb-1.5">Couldn't parse {unparsed.length} block{unparsed.length === 1 ? '' : 's'}</div>
              <div className="text-xs text-ink/65 dark:text-paper/65 mb-2">These blocks didn't match a recognized pattern. Edit your notes to add explicit Q:/A: prefixes, then re-extract.</div>
              <div className="space-y-1.5">
                {unparsed.map((u, i) => (
                  <div key={i} className="text-xs font-mono bg-paper-2 dark:bg-ink/40 p-2 rounded whitespace-pre-wrap">{u.slice(0, 200)}{u.length > 200 ? '…' : ''}</div>
                ))}
              </div>
            </Card>
          )}

          {/* Candidate cards */}
          <div className="space-y-3">
            {candidates.map((c, idx) => (
              <CandidateCard key={c._id} candidate={c} index={idx}
                onUpdate={(patch) => updateCandidate(c._id, patch)}
                onRemove={() => removeCandidate(c._id)} />
            ))}
          </div>

          {candidates.length > 0 && (
            <div className="flex gap-2 pt-2 border-t border-ink/8 dark:border-paper/8">
              <Btn variant="rust" onClick={commitAll}>
                ✓ Add {candidates.filter(c => c._include !== false).length} card{candidates.filter(c => c._include !== false).length === 1 ? '' : 's'}
              </Btn>
              <Btn variant="outline" onClick={reset}>← Back to notes</Btn>
            </div>
          )}
        </>
      )}
    </>
  );
}

function CandidateCard({ candidate, index, onUpdate, onRemove }) {
  const [expanded, setExpanded] = useState(false);
  const included = candidate._include !== false;

  return (
    <div className={`border rounded-lg overflow-hidden transition ${included ? 'border-ink/10 dark:border-paper/10 bg-paper dark:bg-ink-soft' : 'border-ink/8 dark:border-paper/8 bg-paper-2/40 dark:bg-ink/30 opacity-55'}`}>
      {/* Top row — at-a-glance, click to expand */}
      <div className="flex items-start gap-3 p-3">
        <input
          type="checkbox"
          checked={included}
          onChange={(e) => onUpdate({ _include: e.target.checked })}
          className="mt-1 w-4 h-4 accent-rust flex-shrink-0"
          title={included ? 'Will be added' : 'Excluded — won\'t be added'}
        />
        <button onClick={() => setExpanded(!expanded)} className="flex-1 min-w-0 text-left">
          <div className="flex items-center gap-1.5 flex-wrap mb-1">
            <Pill>{candidate.topic}</Pill>
            <Pill color={candidate.difficulty === 'Hard' ? 'rust' : candidate.difficulty === 'Easy' ? 'moss' : 'ochre'}>{candidate.difficulty}</Pill>
            {candidate.source && <span className="text-[10px] uppercase tracking-wider text-ink/45 dark:text-paper/45">via {candidate.source}</span>}
          </div>
          <div className="font-serif text-base font-medium leading-snug line-clamp-2">{candidate.question}</div>
          <div className="text-sm text-ink/65 dark:text-paper/65 line-clamp-1 mt-0.5">{candidate.answer}</div>
        </button>
        <button onClick={onRemove} className="text-ink/40 dark:text-paper/40 hover:text-rust text-lg leading-none px-2 py-0.5 flex-shrink-0" title="Delete this candidate">×</button>
      </div>

      {expanded && (
        <div className="border-t border-ink/8 dark:border-paper/8 p-3 space-y-3 bg-paper-2/30 dark:bg-ink/30 fade-in">
          <div>
            <label className="block text-[10px] uppercase tracking-widest text-ink/55 dark:text-paper/55 mb-1 font-medium">Question</label>
            <Textarea rows={2} value={candidate.question} onChange={(e) => onUpdate({ question: e.target.value })} className="text-sm" />
          </div>
          <div>
            <label className="block text-[10px] uppercase tracking-widest text-ink/55 dark:text-paper/55 mb-1 font-medium">Answer</label>
            <Textarea rows={3} value={candidate.answer} onChange={(e) => onUpdate({ answer: e.target.value })} className="text-sm" />
          </div>
          <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
            <div>
              <label className="block text-[10px] uppercase tracking-widest text-ink/55 dark:text-paper/55 mb-1 font-medium">Topic</label>
              <Select value={candidate.topic} onChange={(v) => onUpdate({ topic: v })} options={TOPICS} className="w-full text-sm" />
            </div>
            <div>
              <label className="block text-[10px] uppercase tracking-widest text-ink/55 dark:text-paper/55 mb-1 font-medium">Difficulty</label>
              <Select value={candidate.difficulty} onChange={(v) => onUpdate({ difficulty: v })} options={DIFFICULTIES} className="w-full text-sm" />
            </div>
            <div>
              <label className="block text-[10px] uppercase tracking-widest text-ink/55 dark:text-paper/55 mb-1 font-medium">Tags (comma-separated)</label>
              <Input
                value={Array.isArray(candidate.tags) ? candidate.tags.join(', ') : candidate.tags}
                onChange={(e) => onUpdate({ tags: e.target.value.split(',').map(s => s.trim()).filter(Boolean) })}
                className="text-sm"
              />
            </div>
          </div>
          <label className="flex items-center gap-2 text-sm cursor-pointer">
            <input type="checkbox" checked={!!candidate.priority} onChange={(e) => onUpdate({ priority: e.target.checked })} className="w-4 h-4 accent-rust" />
            Mark as high priority
          </label>
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// PLAN — Day-by-day study schedule, mock timetable, topic allocation, rules
// ─────────────────────────────────────────────────────────────────────────────

// Phase → color mapping (uses our existing palette tokens)
const PHASE_COLORS = {
  'Learning reinforcement': { bg: 'bg-ink/5 dark:bg-paper/8', text: 'text-ink/70 dark:text-paper/70', border: 'border-ink/10 dark:border-paper/10', dot: 'bg-ink/40 dark:bg-paper/40' },
  'Learning reinforcement to mixed': { bg: 'bg-ink/5 dark:bg-paper/8', text: 'text-ink/70 dark:text-paper/70', border: 'border-ink/10 dark:border-paper/10', dot: 'bg-ink/40 dark:bg-paper/40' },
  'Mixed practice':         { bg: 'bg-moss/10', text: 'text-moss', border: 'border-moss/20', dot: 'bg-moss' },
  'Transition to mock-heavy': { bg: 'bg-moss/10', text: 'text-moss', border: 'border-moss/20', dot: 'bg-moss' },
  'Diagnostic mock':        { bg: 'bg-ochre/15', text: 'text-ochre', border: 'border-ochre/20', dot: 'bg-ochre' },
  'Mock-heavy':             { bg: 'bg-ochre/15', text: 'text-ochre', border: 'border-ochre/20', dot: 'bg-ochre' },
  'Final intensive':        { bg: 'bg-rust/10', text: 'text-rust', border: 'border-rust/20', dot: 'bg-rust' },
  'Full-mock simulation':   { bg: 'bg-rust/10', text: 'text-rust', border: 'border-rust/20', dot: 'bg-rust' },
  'Taper preparation':      { bg: 'bg-rust/10', text: 'text-rust', border: 'border-rust/20', dot: 'bg-rust' },
  'Final 3-day taper':      { bg: 'bg-rust/10', text: 'text-rust', border: 'border-rust/20', dot: 'bg-rust' },
  'Exam day':               { bg: 'bg-rust/20', text: 'text-rust', border: 'border-rust/40', dot: 'bg-rust' },
  'Rest':                   { bg: 'bg-ink/3 dark:bg-paper/4', text: 'text-ink/40 dark:text-paper/40', border: 'border-ink/8 dark:border-paper/8', dot: 'bg-ink/20 dark:bg-paper/20' },
};

function getPhaseStyle(phase) {
  return PHASE_COLORS[phase] || PHASE_COLORS['Learning reinforcement'];
}

// Find the current day index in the schedule based on today's date
function findTodayIndex() {
  const today = todayKey();
  const idx = STUDY_SCHEDULE.findIndex(d => d.date === today);
  if (idx >= 0) return idx;
  // Before plan start
  if (today < STUDY_SCHEDULE[0].date) return -1;
  // After plan end
  return STUDY_SCHEDULE.length;
}

function Plan({ planProgress, updatePlanDay, setView, setReviewFilter, showToast }) {
  const [tab, setTab] = useState('today'); // 'today' | 'schedule' | 'reference'
  const [selectedDate, setSelectedDate] = useState(null);

  const todayIdx = findTodayIndex();
  const inPlanRange = todayIdx >= 0 && todayIdx < STUDY_SCHEDULE.length;

  // Computed metrics
  const metrics = useMemo(() => {
    let plannedHours = 0;
    let completedHours = 0;
    let studyDaysTotal = 0;
    let studyDaysDone = 0;
    let mocksTotal = 0;
    let mocksDone = 0;
    let passedDays = 0;

    STUDY_SCHEDULE.forEach((d, i) => {
      const status = planProgress[d.date]?.status;
      if (d.hours > 0) {
        plannedHours += d.hours;
        studyDaysTotal++;
        if (status === 'done') {
          completedHours += d.hours;
          studyDaysDone++;
        }
      }
      if (d.mock && !d.mock.toLowerCase().includes('review')) {
        // mock day (session or full)
        mocksTotal++;
        if (status === 'done') mocksDone++;
      }
      // Passed days: anything before today
      if (i < todayIdx) passedDays++;
    });

    const daysToExam = Math.max(0, Math.ceil((new Date(STUDY_PLAN_END) - new Date()) / 86400000));
    const totalDays = STUDY_SCHEDULE.length;

    return {
      plannedHours, completedHours, studyDaysTotal, studyDaysDone,
      mocksTotal, mocksDone, passedDays, daysToExam, totalDays,
      pctHours: plannedHours > 0 ? (completedHours / plannedHours) * 100 : 0,
      pctDays: studyDaysTotal > 0 ? (studyDaysDone / studyDaysTotal) * 100 : 0,
    };
  }, [planProgress, todayIdx]);

  // ── Today tab ──────────────────────────────────────────────────────────────
  const renderToday = () => {
    const before = todayIdx < 0;
    const after = todayIdx >= STUDY_SCHEDULE.length;

    if (after) {
      return (
        <Card className="p-8 text-center">
          <div className="font-serif text-2xl mb-2">Plan complete</div>
          <p className="text-ink/60 dark:text-paper/60 max-w-md mx-auto">
            The plan has ended. Good luck on (or after) exam day.
          </p>
          <div className="mt-5">
            <Btn variant="outline" onClick={() => setTab('schedule')}>Browse full schedule</Btn>
          </div>
        </Card>
      );
    }

    if (before) {
      // Pre-start: show the tracker (it will read as 0 progress) plus a
      // friendly "starts on" card and a peek at day 1.
      const firstDay = STUDY_SCHEDULE[0];
      const daysUntilStart = Math.max(0, Math.ceil((new Date(STUDY_PLAN_START) - new Date()) / 86400000));
      return (
        <div className="space-y-5">
          {/* Tracker — empty actual, only planned line visible */}
          <StudyTracker planProgress={planProgress} todayIdx={todayIdx} />

          {/* Pre-start status card */}
          <Card className="p-6 text-center">
            <div className="text-xs uppercase tracking-widest text-ink/50 dark:text-paper/50 font-medium mb-2">
              Plan starts in {daysUntilStart} {daysUntilStart === 1 ? 'day' : 'days'}
            </div>
            <div className="font-serif text-2xl mb-1">Get ready</div>
            <p className="text-ink/60 dark:text-paper/60 text-sm max-w-md mx-auto">
              Your study plan begins on {new Date(STUDY_PLAN_START).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' })}. Use these days to build your flashcard deck and warm up.
            </p>
            <div className="mt-4 flex gap-2 justify-center flex-wrap">
              <Btn variant="rust" onClick={() => { setReviewFilter({ scope: 'due', topic: 'all', tag: 'all', difficulty: 'all' }); setView('review'); }}>Review flashcards</Btn>
              <Btn variant="outline" onClick={() => setTab('schedule')}>Browse full schedule</Btn>
            </div>
          </Card>

          {/* Day 1 preview */}
          <div>
            <div className="text-xs uppercase tracking-widest text-ink/50 dark:text-paper/50 font-medium mb-2 px-1">First day preview</div>
            <ContextDayCard label={`Day 1 · ${new Date(firstDay.date + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' })}`} day={firstDay} progress={planProgress[firstDay.date]} updatePlanDay={updatePlanDay} />
          </div>
        </div>
      );
    }

    const today = STUDY_SCHEDULE[todayIdx];
    const yesterday = todayIdx > 0 ? STUDY_SCHEDULE[todayIdx - 1] : null;
    const tomorrow = todayIdx < STUDY_SCHEDULE.length - 1 ? STUDY_SCHEDULE[todayIdx + 1] : null;

    return (
      <div className="space-y-5">
        {/* Progress tracker — cumulative hours actual vs planned */}
        <StudyTracker planProgress={planProgress} todayIdx={todayIdx} />

        {/* Today big card */}
        <DayCard day={today} progress={planProgress[today.date]} updatePlanDay={updatePlanDay} large
          onStartReview={() => { setReviewFilter({ scope: 'due', topic: 'all', tag: 'all', difficulty: 'all' }); setView('review'); }}
          onLogMockMistake={() => { setView('create'); }}
        />

        {/* Yesterday / Tomorrow context */}
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          {yesterday && <ContextDayCard label="Yesterday" day={yesterday} progress={planProgress[yesterday.date]} updatePlanDay={updatePlanDay} />}
          {tomorrow && <ContextDayCard label="Tomorrow" day={tomorrow} progress={planProgress[tomorrow.date]} updatePlanDay={updatePlanDay} />}
        </div>

        {/* Metrics row */}
        <Card className="p-5">
          <h2 className="font-serif text-xl font-medium mb-4">Plan progress</h2>
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <PlanStat label="Hours done" value={`${metrics.completedHours.toFixed(1)}h`} sub={`of ${metrics.plannedHours.toFixed(1)}h`} pct={metrics.pctHours} />
            <PlanStat label="Study days" value={`${metrics.studyDaysDone}`} sub={`of ${metrics.studyDaysTotal}`} pct={metrics.pctDays} />
            <PlanStat label="Mocks done" value={`${metrics.mocksDone}`} sub={`of ${metrics.mocksTotal} planned`} pct={metrics.mocksTotal > 0 ? (metrics.mocksDone / metrics.mocksTotal) * 100 : 0} />
            <PlanStat label="Days to exam" value={metrics.daysToExam} sub="14 Aug 2026" pct={null} />
          </div>
        </Card>
      </div>
    );
  };

  // ── Schedule tab ───────────────────────────────────────────────────────────
  const renderSchedule = () => {
    // Group by week
    const weeks = {};
    STUDY_SCHEDULE.forEach((d, i) => {
      if (!weeks[d.week]) weeks[d.week] = [];
      weeks[d.week].push({ ...d, scheduleIdx: i });
    });

    return (
      <div className="space-y-5">
        {/* Quick legend */}
        <Card className="p-4">
          <div className="flex flex-wrap gap-3 items-center text-xs">
            <div className="text-ink/55 dark:text-paper/55 font-medium uppercase tracking-widest">Phases:</div>
            {[
              { label: 'Learning', phase: 'Learning reinforcement' },
              { label: 'Mixed', phase: 'Mixed practice' },
              { label: 'Mock-heavy', phase: 'Mock-heavy' },
              { label: 'Final intensive', phase: 'Final intensive' },
              { label: 'Taper', phase: 'Final 3-day taper' },
              { label: 'Rest', phase: 'Rest' },
            ].map(({ label, phase }) => {
              const s = getPhaseStyle(phase);
              return (
                <div key={label} className="flex items-center gap-1.5">
                  <div className={`w-2 h-2 rounded-full ${s.dot}`}></div>
                  <span className="text-ink/65 dark:text-paper/65">{label}</span>
                </div>
              );
            })}
          </div>
        </Card>

        {Object.entries(weeks).map(([weekNum, days]) => {
          const weekHours = days.reduce((s, d) => s + d.hours, 0);
          const weekDone = days.filter(d => planProgress[d.date]?.status === 'done').length;
          const studyDaysInWeek = days.filter(d => d.hours > 0).length;
          return (
            <div key={weekNum}>
              <div className="flex items-center justify-between mb-2 px-1">
                <h2 className="font-serif text-lg font-medium">Week {weekNum}</h2>
                <div className="text-xs text-ink/55 dark:text-paper/55 tabular-nums">
                  {weekHours.toFixed(1)}h planned · {weekDone}/{studyDaysInWeek} done
                </div>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-7 gap-1.5">
                {days.map(d => (
                  <DayMiniCard key={d.date} day={d} progress={planProgress[d.date]}
                    isToday={d.scheduleIdx === todayIdx}
                    isPast={d.scheduleIdx < todayIdx}
                    onClick={() => setSelectedDate(d.date)} />
                ))}
              </div>
            </div>
          );
        })}

        {selectedDate && (
          <DayDetailModal
            day={STUDY_SCHEDULE.find(d => d.date === selectedDate)}
            progress={planProgress[selectedDate]}
            updatePlanDay={updatePlanDay}
            onClose={() => setSelectedDate(null)}
          />
        )}
      </div>
    );
  };

  // ── Reference tab ─────────────────────────────────────────────────────────
  const renderReference = () => (
    <div className="space-y-5">
      {/* Topic allocation */}
      <Card className="p-5">
        <h2 className="font-serif text-xl font-medium mb-1">Topic allocation</h2>
        <p className="text-xs text-ink/55 dark:text-paper/55 mb-4">Official weights & planning emphasis (Portfolio Management pathway)</p>

// ─────────────────────────────────────────────────────────────────────────────
// STUDY TRACKER — cumulative hours: actual (filled area) vs planned (dashed)
// Mirrors the look of the Apple/Garmin training-load tracker reference, but
// in the app's paper-and-ink palette. Hours-based because that's what the
// plan is denominated in.
// ─────────────────────────────────────────────────────────────────────────────

function StudyTracker({ planProgress, todayIdx }) {
  const isDark = typeof document !== 'undefined' && document.documentElement.classList.contains('dark');

  // Build cumulative series — actualHours, plannedHours over every plan day
  const series = useMemo(() => {
    let cumActual = 0;
    let cumPlanned = 0;
    return STUDY_SCHEDULE.map((d, i) => {
      cumPlanned += d.hours;
      if (planProgress[d.date]?.status === 'done' && d.hours > 0) {
        cumActual += d.hours;
      }
      return {
        idx: i,
        date: d.date,
        actual: i <= todayIdx ? cumActual : null,  // only draw actual up to today
        planned: cumPlanned,
        isToday: i === todayIdx,
      };
    });
  }, [planProgress, todayIdx]);

  const totalPlanned = STUDY_PLAN_TOTAL_HOURS;
  const todayPoint = todayIdx >= 0 && todayIdx < series.length ? series[todayIdx] : null;
  const actualSoFar = todayPoint?.actual || 0;
  const plannedSoFar = todayPoint?.planned || 0;
  const progressPct = totalPlanned > 0 ? (actualSoFar / totalPlanned) * 100 : 0;
  const onTrackPct = plannedSoFar > 0 ? (actualSoFar / plannedSoFar) * 100 : 0;
  const planStarted = todayIdx >= 0;

  // Projected completion date: at your current hours-per-day pace, when do you hit 100%?
  // Only computed once the plan has started AND you have some actual progress.
  const daysElapsed = todayIdx + 1; // inclusive
  const pace = daysElapsed > 0 ? actualSoFar / daysElapsed : 0;
  let readyDate = null;
  if (planStarted && pace > 0) {
    const remainingHours = Math.max(0, totalPlanned - actualSoFar);
    const daysNeeded = remainingHours / pace;
    const d = new Date();
    d.setDate(d.getDate() + Math.ceil(daysNeeded));
    readyDate = d;
  }
  const examDate = new Date(STUDY_PLAN_END);
  // Only show on-pace pill once we have meaningful data (plan started + at least 7 days of progress)
  const onPaceForExam = (planStarted && daysElapsed >= 7 && readyDate) ? readyDate <= examDate : null;

  // Average hours per week — actual if plan started, otherwise show the planned average
  let avgPerWeek;
  let avgPerWeekLabel = 'Average per week';
  if (planStarted) {
    const recentWeeks = Math.min(4, Math.ceil(daysElapsed / 7));
    const recentWindow = series.slice(Math.max(0, todayIdx - recentWeeks * 7), todayIdx + 1);
    const recentActual = recentWindow.length > 1
      ? (recentWindow[recentWindow.length - 1].actual || 0) - (recentWindow[0].actual || 0)
      : actualSoFar;
    avgPerWeek = recentWindow.length > 0 ? (recentActual / Math.max(1, recentWindow.length / 7)) : 0;
  } else {
    // Pre-start: show planned weekly average so the user knows what's coming
    avgPerWeek = totalPlanned / (STUDY_SCHEDULE.length / 7);
    avgPerWeekLabel = 'Planned per week';
  }

  // Days until exam (or until plan start, pre-start)
  const daysToExam = Math.max(0, Math.ceil((examDate - new Date()) / 86400000));
  const daysToStart = Math.max(0, Math.ceil((new Date(STUDY_PLAN_START) - new Date()) / 86400000));

  // ── SVG geometry ──
  const W = 560;
  const H = 200;
  const PADDING = { top: 20, right: 36, bottom: 36, left: 44 };
  const innerW = W - PADDING.left - PADDING.right;
  const innerH = H - PADDING.top - PADDING.bottom;

  const xFor = (i) => PADDING.left + (i / (series.length - 1)) * innerW;
  const yFor = (hours) => PADDING.top + innerH - (hours / totalPlanned) * innerH;

  // Build SVG paths
  const plannedPath = series.map((p, i) => `${i === 0 ? 'M' : 'L'} ${xFor(i)} ${yFor(p.planned)}`).join(' ');

  const actualPoints = series.filter(p => p.actual != null);
  const actualLinePath = actualPoints.map((p, i) => `${i === 0 ? 'M' : 'L'} ${xFor(p.idx)} ${yFor(p.actual)}`).join(' ');
  const actualAreaPath = actualPoints.length > 0
    ? `${actualLinePath} L ${xFor(actualPoints[actualPoints.length - 1].idx)} ${yFor(0)} L ${xFor(0)} ${yFor(0)} Z`
    : '';

  // Y-axis ticks: 0, 25, 50, 75, 100%
  const yTicks = [0, 0.25, 0.5, 0.75, 1.0];

  // X-axis labels: start, today, end
  const startDate = new Date(STUDY_PLAN_START);
  const fmtDate = (d) => d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

  // Theme colors (use rust as primary, ink-grey for planned reference)
  const colors = {
    actualStroke: '#c14a2b',
    actualFillTop: 'rgba(193,74,43,0.28)',
    actualFillBottom: 'rgba(193,74,43,0.02)',
    plannedStroke: isDark ? 'rgba(232,230,227,0.42)' : 'rgba(10,25,41,0.40)',
    axis: isDark ? 'rgba(232,230,227,0.55)' : 'rgba(10,25,41,0.55)',
    grid: isDark ? 'rgba(232,230,227,0.08)' : 'rgba(10,25,41,0.08)',
    todayLine: isDark ? 'rgba(232,230,227,0.20)' : 'rgba(10,25,41,0.20)',
  };

  return (
    <Card className="p-5">
      {/* Header */}
      <div className="flex items-start justify-between mb-4 flex-wrap gap-3">
        <h2 className="font-serif text-xl font-medium">My study plan</h2>
        <div className="flex items-center gap-2 text-xs font-medium">
          {!planStarted && (
            <span className="inline-flex items-center gap-1.5 px-2 py-1 rounded-full bg-ochre/15 text-ochre border border-ochre/20">
              <span className="w-1.5 h-1.5 rounded-full bg-ochre" />
              {daysToStart === 0 ? 'Starts today' : `Starts in ${daysToStart}d`}
            </span>
          )}
          {planStarted && onPaceForExam === true && (
            <span className="inline-flex items-center gap-1.5 px-2 py-1 rounded-full bg-moss/10 text-moss border border-moss/20">
              <span className="w-1.5 h-1.5 rounded-full bg-moss" /> On pace
            </span>
          )}
          {planStarted && onPaceForExam === false && (
            <span className="inline-flex items-center gap-1.5 px-2 py-1 rounded-full bg-rust/10 text-rust border border-rust/20">
              <span className="w-1.5 h-1.5 rounded-full bg-rust" /> Behind pace
            </span>
          )}
        </div>
      </div>

      {/* Headline stats row */}
      <div className="grid grid-cols-2 gap-4 mb-5">
        <div>
          <div className="font-serif text-3xl md:text-4xl font-medium leading-none">
            {avgPerWeek.toFixed(1)}<span className="text-lg text-ink/55 dark:text-paper/55 font-sans font-normal ml-1">h</span>
          </div>
          <div className="text-xs text-ink/55 dark:text-paper/55 mt-1.5 uppercase tracking-wider font-medium">{avgPerWeekLabel}</div>
        </div>
        <div>
          <div className="font-serif text-3xl md:text-4xl font-medium leading-none">
            {daysToExam}<span className="text-lg text-ink/55 dark:text-paper/55 font-sans font-normal ml-1">days</span>
          </div>
          <div className="text-xs text-ink/55 dark:text-paper/55 mt-1.5 uppercase tracking-wider font-medium">Until exam</div>
        </div>
      </div>

      {/* Chart */}
      <div className="overflow-x-auto -mx-2">
        <svg viewBox={`0 0 ${W} ${H}`} width="100%" preserveAspectRatio="xMidYMid meet" style={{ maxWidth: '100%', minWidth: 360 }}>
          <defs>
            <linearGradient id="actualFillGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={colors.actualFillTop} />
              <stop offset="100%" stopColor={colors.actualFillBottom} />
            </linearGradient>
          </defs>

          {/* Horizontal grid lines + y-axis labels */}
          {yTicks.map((t, i) => {
            const y = PADDING.top + innerH - t * innerH;
            return (
              <g key={i}>
                <line x1={PADDING.left} y1={y} x2={W - PADDING.right} y2={y}
                  stroke={colors.grid} strokeWidth="1"
                  strokeDasharray={t === 0 ? '0' : '2 4'} />
                <text x={PADDING.left - 8} y={y + 3} textAnchor="end"
                  fontSize="10" fill={colors.axis} fontFamily="Inter, sans-serif">
                  {Math.round(t * 100)}%
                </text>
              </g>
            );
          })}

          {/* Planned reference line (dashed) */}
          <path d={plannedPath} fill="none" stroke={colors.plannedStroke}
            strokeWidth="1.5" strokeDasharray="4 4" strokeLinecap="round" />

          {/* End-of-plan marker (small ring, replaces tacky trophy) */}
          <circle cx={xFor(series.length - 1)} cy={yFor(totalPlanned)} r="6"
            fill="none" stroke={colors.plannedStroke} strokeWidth="1.5" />
          <circle cx={xFor(series.length - 1)} cy={yFor(totalPlanned)} r="2.5"
            fill={colors.plannedStroke} />

          {/* Actual filled area */}
          {actualAreaPath && <path d={actualAreaPath} fill="url(#actualFillGrad)" />}
          {actualLinePath && <path d={actualLinePath} fill="none" stroke={colors.actualStroke}
            strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />}

          {/* "Today" marker on the actual curve */}
          {todayPoint && todayPoint.actual != null && (
            <>
              <line x1={xFor(todayIdx)} y1={PADDING.top} x2={xFor(todayIdx)} y2={PADDING.top + innerH}
                stroke={colors.todayLine} strokeWidth="1" strokeDasharray="2 3" />
              <circle cx={xFor(todayIdx)} cy={yFor(todayPoint.actual)} r="5"
                fill={isDark ? '#15161a' : '#fbf8f3'} stroke={colors.actualStroke} strokeWidth="2" />
            </>
          )}

          {/* X-axis labels */}
          <text x={PADDING.left} y={H - 14} textAnchor="start" fontSize="10" fill={colors.axis} fontFamily="Inter, sans-serif">
            Start
          </text>
          <text x={PADDING.left} y={H - 2} textAnchor="start" fontSize="9.5" fill={colors.axis} opacity="0.7" fontFamily="Inter, sans-serif">
            {fmtDate(startDate)}
          </text>
          <text x={W - PADDING.right} y={H - 14} textAnchor="end" fontSize="10" fill={colors.axis} fontFamily="Inter, sans-serif">
            Exam
          </text>
          <text x={W - PADDING.right} y={H - 2} textAnchor="end" fontSize="9.5" fill={colors.axis} opacity="0.7" fontFamily="Inter, sans-serif">
            {fmtDate(examDate)}
          </text>
        </svg>
      </div>

      {/* Footer summary */}
      <div className="mt-4 pt-4 border-t border-ink/8 dark:border-paper/8 flex flex-wrap items-center gap-x-6 gap-y-3 text-sm">
        <div className="flex items-center gap-2">
          <span className="w-2.5 h-2.5 rounded-full bg-rust flex-shrink-0" />
          <span className="text-ink/65 dark:text-paper/65">Progress:</span>
          <span className="font-serif font-medium tabular-nums">{progressPct.toFixed(1)}%</span>
        </div>
        <div className="flex items-center gap-2">
          <span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{
            background: !planStarted ? 'rgba(10,25,41,0.25)' : (onPaceForExam === false ? '#c14a2b' : '#5a7a4f')
          }} />
          <span className="text-ink/65 dark:text-paper/65">Ready date:</span>
          <span className="font-serif font-medium tabular-nums">
            {readyDate ? readyDate.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : (planStarted ? 'pending' : '—')}
          </span>
        </div>
        <div className="flex items-center gap-2">
          <span className="inline-block w-4 h-0 border-t border-dashed flex-shrink-0" style={{ borderColor: colors.plannedStroke }} />
          <span className="text-ink/65 dark:text-paper/65">Planned pace</span>
        </div>
        <div className="ml-auto text-xs text-ink/55 dark:text-paper/55 tabular-nums">
          {actualSoFar.toFixed(1)}h / {totalPlanned}h
        </div>
      </div>
    </Card>

// Helper — what should the score field be called for this day?
function getScoreLabel(day) {
  if (day.mock) return 'Mock score';
  if (day.sessionType && /practice|mixed/i.test(day.sessionType)) return 'Practice %';
  if (day.sessionType && /recall|review/i.test(day.sessionType)) return 'Recall %';
  return 'Session score';
}

// Single numeric input cell — score (0-100, %) OR question count (0-999, int).
// Used inside SessionMetrics so the two fields render with identical look.
function MetricInput({ day, progress, field, label, max, step, suffix, integer, colorize, hint, updatePlanDay }) {
  const value = progress?.[field];
  const [draft, setDraft] = useState(value != null ? String(value) : '');

  useEffect(() => {
    setDraft(value != null ? String(value) : '');
  }, [value]);

  const commit = (val) => {
    const trimmed = String(val).trim();
    if (trimmed === '') {
      updatePlanDay(day.date, { [field]: null });
      return;
    }
    const num = parseFloat(trimmed);
    if (isNaN(num) || num < 0 || num > max) return;
    const final = integer ? Math.round(num) : Math.round(num * 10) / 10;
    updatePlanDay(day.date, { [field]: final });
  };

  const handleBlur = () => commit(draft);
  const handleKey = (e) => {
    if (e.key === 'Enter') { e.target.blur(); }
    if (e.key === 'Escape') { setDraft(value != null ? String(value) : ''); e.target.blur(); }
  };

  // Color cue — only used for score; not meaningful for counts
  const textColor = !colorize || value == null
    ? 'text-ink dark:text-paper'
    : value >= 70 ? 'text-moss'
    : value >= 55 ? 'text-ochre'
    : 'text-rust';

  return (
    <div>
      <label className="block text-[10px] uppercase tracking-widest text-ink/55 dark:text-paper/55 mb-1 font-medium">
        {label}
      </label>
      <div className="flex items-center gap-1.5">
        <Input
          type="number"
          min="0" max={max} step={step}
          value={draft}
          onChange={(e) => setDraft(e.target.value)}
          onBlur={handleBlur}
          onKeyDown={handleKey}
          placeholder="—"
          className={`w-20 text-sm font-serif text-center tabular-nums font-medium ${textColor}`}
        />
        {suffix && <span className="text-sm text-ink/55 dark:text-paper/55">{suffix}</span>}
        {value != null && (
          <button
            onClick={() => { setDraft(''); updatePlanDay(day.date, { [field]: null }); }}
            className="text-[11px] text-ink/40 dark:text-paper/40 hover:text-rust transition ml-0.5"
            title="Clear"
          >
            ✕
          </button>
        )}
      </div>
      {hint && <div className="text-[10px] text-ink/45 dark:text-paper/45 mt-1">{hint}</div>}
    </div>
  );
}

// Reusable two-field row: score + questions answered. Appears in DayCard and DayDetailModal.
function SessionMetrics({ day, progress, updatePlanDay }) {
  // Build a useful hint for questions — show the planned range from the schedule
  const qHint = day.qTarget ? `target ${day.qTarget}` : null;
  return (
    <div className="flex flex-wrap gap-x-6 gap-y-3">
      <MetricInput
        day={day} progress={progress} updatePlanDay={updatePlanDay}
        field="mockScore" label={getScoreLabel(day)}
        max={100} step="0.5" suffix="%" integer={false} colorize={true}
      />
      <MetricInput
        day={day} progress={progress} updatePlanDay={updatePlanDay}
        field="questionsAnswered" label="Questions"
        max={999} step="1" suffix="Q" integer={true} colorize={false}
        hint={qHint}
      />
    </div>
  );
}

function DayCard({ day, progress, updatePlanDay, large, onStartReview, onLogMockMistake }) {
  const style = getPhaseStyle(day.phase);
  const isRest = day.phase === 'Rest';
  const isMock = !!day.mock;
  const isExam = day.phase === 'Exam day';
  const status = progress?.status;
  const dateObj = new Date(day.date + 'T00:00:00');

  return (
    <Card className={`overflow-hidden ${large ? '' : ''}`}>
      <div className={`px-5 py-3 border-b border-ink/8 dark:border-paper/8 flex items-center justify-between flex-wrap gap-2 ${style.bg}`}>
        <div className="flex items-center gap-3 flex-wrap">
          <div className="text-xs uppercase tracking-widest text-ink/60 dark:text-paper/60 font-medium">
            Today · {dateObj.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' })}
          </div>
          <Pill color={isExam ? 'rust' : isMock ? 'ochre' : isRest ? 'default' : 'moss'}>
            {day.phase}
          </Pill>
        </div>
        <div className="text-sm tabular-nums font-medium">
          {day.hours > 0 ? `${day.hours}h` : 'rest'}

// ─────────────────────────────────────────────────────────────────────────────
// SCORE PERFORMANCE — analytics for daily session scores logged by the user
// Adapts the motivational tone to what the data actually shows.
