// Categorise a day for charting/grouping
function categorizeForScore(day) {
  if (day.mock) return 'Mock';
  if (day.sessionType && /practice|mixed/i.test(day.sessionType)) return 'Practice';
  return 'Recall'; // default: recall, review, anything else
}

// Pick a motivational phrase based on actual performance signals.
// Honest, never sappy. Adapts to what the data shows.
function getMotivation({ count, avg, trend, latest, hasMock, bestMock }) {
  if (count === 0) {
    return {
      headline: 'Score your first session to begin tracking.',
      sub: 'Enter a % on any completed day card (Plan → Today). Mocks, practice sets, and recall sessions all count.',
      tone: 'neutral',
    };
  }
  if (count < 3) {
    return {
      headline: 'Good start — keep logging.',
      sub: 'A few more data points and you\'ll see real trends, not noise.',
      tone: 'neutral',
    };
  }
  // Real signal phase (3+ scores)
  if (avg >= 75) {
    if (trend > 2) return { headline: 'You\'re ready and getting stronger.', sub: `Average ${avg.toFixed(0)}% with an upward trend. The work is showing — stay consistent.`, tone: 'great' };
    if (trend < -3) return { headline: 'Strong baseline, but watch the slip.', sub: `Average ${avg.toFixed(0)}% is exam-ready, but your last few are down. Check what changed.`, tone: 'caution' };
    return { headline: 'On exam-ready footing.', sub: `Average ${avg.toFixed(0)}%. Maintain the rhythm and protect your weak topics in the final weeks.`, tone: 'great' };
  }
  if (avg >= 60) {
    if (trend > 2) return { headline: 'Climbing into pass territory.', sub: `Average ${avg.toFixed(0)}%, trending up by ${trend.toFixed(0)} points. This is the curve you want.`, tone: 'good' };
    if (trend < -3) return { headline: 'Plateau — break it before it sets.', sub: `Average ${avg.toFixed(0)}% but the last few are sliding. Reset on a weak topic this week.`, tone: 'caution' };
    return { headline: 'Solid foundation. Push the average.', sub: `Average ${avg.toFixed(0)}%. The minimum passing score (MPS) is typically 65–70%. Targeted practice on weak topics moves the needle fastest.`, tone: 'good' };
  }
  if (avg >= 45) {
    if (trend > 2) return { headline: 'The trajectory is right.', sub: `Average ${avg.toFixed(0)}%, up by ${trend.toFixed(0)} points. Keep doing what you\'re doing — don\'t change the routine while it\'s working.`, tone: 'good' };
    return { headline: 'Below pass line — fix the leaks.', sub: `Average ${avg.toFixed(0)}%. Identify your two weakest topics and rebuild them with focused practice this week.`, tone: 'caution' };
  }
  // avg < 45 — needs honest signal
  if (trend > 3) return { headline: 'Climbing fast from a low base.', sub: `Average ${avg.toFixed(0)}% but up ${trend.toFixed(0)} points. Momentum is real — keep going.`, tone: 'good' };
  return {
    headline: 'Be honest about where you are.',
    sub: `Average ${avg.toFixed(0)}% — well below pass. This is the moment to triage: which 2–3 topics are dragging you down? Fix those first.`,
    tone: 'urgent',
  };
}

function ScorePerformance({ planProgress }) {
  const isDark = typeof document !== 'undefined' && document.documentElement.classList.contains('dark');

  // Pull all scored days (date + score + category)
  const scoredDays = useMemo(() => {
    const out = [];
    for (const d of STUDY_SCHEDULE) {
      const prog = planProgress[d.date];
      if (prog?.mockScore != null) {
        out.push({
          date: d.date,
          dateObj: new Date(d.date + 'T00:00:00'),
          score: prog.mockScore,
          category: categorizeForScore(d),
          topic: d.topic,
          mock: d.mock,
        });
      }
    }
    out.sort((a, b) => a.date.localeCompare(b.date));
    return out;
  }, [planProgress]);

  const count = scoredDays.length;
  const avg = count > 0 ? scoredDays.reduce((s, d) => s + d.score, 0) / count : 0;
  const best = count > 0 ? Math.max(...scoredDays.map(d => d.score)) : 0;
  const latest = count > 0 ? scoredDays[count - 1].score : 0;

  // Trend = average of last 3 minus average of first 3 (or overall first if fewer)
  let trend = 0;
  if (count >= 3) {
    const last3Avg = (scoredDays[count - 1].score + scoredDays[count - 2].score + scoredDays[count - 3].score) / 3;
    const first3 = scoredDays.slice(0, 3);
    const first3Avg = first3.reduce((s, d) => s + d.score, 0) / first3.length;
    trend = last3Avg - first3Avg;
  }

  // Category averages
  const byCategory = useMemo(() => {
    const groups = {};
    for (const d of scoredDays) {
      if (!groups[d.category]) groups[d.category] = [];
      groups[d.category].push(d.score);
    }
    return Object.entries(groups).map(([cat, scores]) => ({
      category: cat,
      count: scores.length,
      avg: scores.reduce((s, x) => s + x, 0) / scores.length,
      best: Math.max(...scores),
    })).sort((a, b) => b.count - a.count);
  }, [scoredDays]);

  // Mock-specific
  const mocks = scoredDays.filter(d => d.category === 'Mock');
  const bestMock = mocks.length > 0 ? Math.max(...mocks.map(m => m.score)) : 0;

  const motivation = getMotivation({ count, avg, trend, latest, hasMock: mocks.length > 0, bestMock });

  // Chart geometry — simple line chart
  const W = 600;
  const H = 220;
  const PADDING = { top: 20, right: 24, bottom: 36, left: 40 };
  const innerW = W - PADDING.left - PADDING.right;
  const innerH = H - PADDING.top - PADDING.bottom;

  const xFor = (i) => count <= 1 ? PADDING.left + innerW / 2 : PADDING.left + (i / (count - 1)) * innerW;
  const yFor = (score) => PADDING.top + innerH - (score / 100) * innerH;

  // Build the line path
  const linePath = scoredDays.map((d, i) => `${i === 0 ? 'M' : 'L'} ${xFor(i)} ${yFor(d.score)}`).join(' ');

  // MPS reference at 70%
  const mpsY = yFor(70);

  const colors = {
    line: '#c14a2b',
    pointFill: isDark ? '#15161a' : '#fbf8f3',
    axis: isDark ? 'rgba(232,230,227,0.55)' : 'rgba(10,25,41,0.55)',
    grid: isDark ? 'rgba(232,230,227,0.08)' : 'rgba(10,25,41,0.08)',
    mps: '#5a7a4f',
    mpsLabel: isDark ? 'rgba(130,165,119,0.85)' : 'rgba(90,122,79,0.85)',
  };

  // Motivation banner color
  const toneStyles = {
    great:   { bg: 'bg-moss/10', border: 'border-moss/25', dot: 'bg-moss', text: 'text-moss' },
    good:    { bg: 'bg-ink/5 dark:bg-paper/5', border: 'border-ink/15 dark:border-paper/15', dot: 'bg-ink/40 dark:bg-paper/40', text: 'text-ink dark:text-paper' },
    caution: { bg: 'bg-ochre/10', border: 'border-ochre/25', dot: 'bg-ochre', text: 'text-ochre' },
    urgent:  { bg: 'bg-rust/10', border: 'border-rust/25', dot: 'bg-rust', text: 'text-rust' },
    neutral: { bg: 'bg-ink/5 dark:bg-paper/5', border: 'border-ink/10 dark:border-paper/10', dot: 'bg-ink/30 dark:bg-paper/30', text: 'text-ink/65 dark:text-paper/65' },
  }[motivation.tone] || {};

  return (
    <Card className="p-5">
      <div className="flex items-start justify-between gap-3 mb-4 flex-wrap">
        <div>
          <h2 className="font-serif text-xl font-medium">Session score performance</h2>
          <p className="text-xs text-ink/55 dark:text-paper/55 mt-1">
            Scores you've logged on mocks, practice sets, and recall sessions
          </p>
        </div>
      </div>

      {/* Motivational banner — adapts to data */}
      <div className={`mb-5 rounded-lg border p-4 ${toneStyles.bg} ${toneStyles.border}`}>
        <div className="flex items-start gap-3">
          <div className={`mt-1.5 w-2 h-2 rounded-full flex-shrink-0 ${toneStyles.dot}`} />
          <div>
            <div className={`font-serif text-lg font-medium leading-snug ${toneStyles.text}`}>{motivation.headline}</div>
            <div className="text-sm text-ink/65 dark:text-paper/65 mt-1">{motivation.sub}</div>
          </div>
        </div>
      </div>

      {count === 0 ? null : (
        <>
          {/* Stat row */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-5">
            <div>
              <div className="text-xs uppercase tracking-wider text-ink/50 dark:text-paper/50 font-medium">Average</div>
              <div className="font-serif text-3xl font-medium mt-1 tabular-nums">
                {avg.toFixed(1)}<span className="text-base text-ink/55 dark:text-paper/55 font-sans font-normal ml-1">%</span>
              </div>
            </div>
            <div>
              <div className="text-xs uppercase tracking-wider text-ink/50 dark:text-paper/50 font-medium">Latest</div>
              <div className="font-serif text-3xl font-medium mt-1 tabular-nums">
                {latest.toFixed(1)}<span className="text-base text-ink/55 dark:text-paper/55 font-sans font-normal ml-1">%</span>
              </div>
            </div>
            <div>
              <div className="text-xs uppercase tracking-wider text-ink/50 dark:text-paper/50 font-medium">Best</div>
              <div className="font-serif text-3xl font-medium mt-1 tabular-nums">
                {best.toFixed(1)}<span className="text-base text-ink/55 dark:text-paper/55 font-sans font-normal ml-1">%</span>
              </div>
            </div>
            <div>
              <div className="text-xs uppercase tracking-wider text-ink/50 dark:text-paper/50 font-medium">Trend</div>
              <div className={`font-serif text-3xl font-medium mt-1 tabular-nums ${trend > 0 ? 'text-moss' : trend < 0 ? 'text-rust' : 'text-ink/55 dark:text-paper/55'}`}>
                {count < 3 ? '—' : (trend >= 0 ? '+' : '') + trend.toFixed(1)}
                {count >= 3 && <span className="text-base text-ink/55 dark:text-paper/55 font-sans font-normal ml-1">pts</span>}
              </div>
            </div>
          </div>

          {/* Chart */}
          <div className="overflow-x-auto -mx-2 mb-4">
            <svg viewBox={`0 0 ${W} ${H}`} width="100%" preserveAspectRatio="xMidYMid meet" style={{ maxWidth: '100%', minWidth: 360 }}>
              {/* Grid lines at 0, 25, 50, 75, 100 */}
              {[0, 0.25, 0.5, 0.75, 1.0].map((t, i) => {
                const y = PADDING.top + innerH - t * innerH;
                return (
                  <g key={i}>
                    <line x1={PADDING.left} y1={y} x2={W - PADDING.right} y2={y}
                      stroke={colors.grid} strokeWidth="1"
                      strokeDasharray={t === 0 ? '0' : '2 4'} />
                    <text x={PADDING.left - 6} y={y + 3} textAnchor="end" fontSize="10" fill={colors.axis} fontFamily="Inter, sans-serif">
                      {Math.round(t * 100)}%
                    </text>
                  </g>
                );
              })}

              {/* MPS reference line at 70% */}
              <line x1={PADDING.left} y1={mpsY} x2={W - PADDING.right} y2={mpsY}
                stroke={colors.mps} strokeWidth="1" strokeDasharray="3 3" opacity="0.6" />
              <text x={W - PADDING.right - 4} y={mpsY - 5} textAnchor="end" fontSize="10" fill={colors.mpsLabel} fontFamily="Inter, sans-serif">
                ~MPS 70%
              </text>

              {/* Score line */}
              {count >= 2 && (
                <path d={linePath} fill="none" stroke={colors.line} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
              )}

              {/* Score dots */}
              {scoredDays.map((d, i) => (
                <g key={i}>
                  <circle
                    cx={xFor(i)} cy={yFor(d.score)} r="4.5"
                    fill={colors.pointFill}
                    stroke={d.category === 'Mock' ? '#c14a2b' : d.category === 'Practice' ? '#b88a3a' : '#5a7a4f'}
                    strokeWidth="2"
                  />
                  <title>{`${d.dateObj.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })} · ${d.category}: ${d.score}%${d.mock ? ` (${d.mock})` : ''}`}</title>
                </g>
              ))}

              {/* X-axis date labels — first, middle, last */}
              {count > 0 && (
                <>
                  <text x={xFor(0)} y={H - 16} textAnchor="start" fontSize="10" fill={colors.axis} fontFamily="Inter, sans-serif">
                    {scoredDays[0].dateObj.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}
                  </text>
                  {count >= 5 && (
                    <text x={xFor(Math.floor((count - 1) / 2))} y={H - 16} textAnchor="middle" fontSize="10" fill={colors.axis} fontFamily="Inter, sans-serif">
                      {scoredDays[Math.floor((count - 1) / 2)].dateObj.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}
                    </text>
                  )}
                  {count > 1 && (
                    <text x={xFor(count - 1)} y={H - 16} textAnchor="end" fontSize="10" fill={colors.axis} fontFamily="Inter, sans-serif">
                      {scoredDays[count - 1].dateObj.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}
                    </text>
                  )}
                </>
              )}
            </svg>
          </div>

          {/* Category legend */}
          <div className="flex items-center justify-center gap-5 text-xs mb-4">
            <div className="flex items-center gap-1.5">
              <div className="w-2.5 h-2.5 rounded-full border-2 border-rust bg-transparent" />
              <span className="text-ink/65 dark:text-paper/65">Mock</span>
            </div>
            <div className="flex items-center gap-1.5">
              <div className="w-2.5 h-2.5 rounded-full border-2 border-ochre bg-transparent" />
              <span className="text-ink/65 dark:text-paper/65">Practice</span>
            </div>
            <div className="flex items-center gap-1.5">
              <div className="w-2.5 h-2.5 rounded-full border-2 border-moss bg-transparent" />
              <span className="text-ink/65 dark:text-paper/65">Recall</span>
            </div>
          </div>

          {/* Breakdown by category */}
          {byCategory.length > 1 && (
            <div className="pt-4 border-t border-ink/8 dark:border-paper/8">
              <div className="text-xs uppercase tracking-widest text-ink/55 dark:text-paper/55 font-medium mb-3">By session type</div>
              <div className="space-y-2.5">
                {byCategory.map(c => {
                  const catColor = c.category === 'Mock' ? '#c14a2b' : c.category === 'Practice' ? '#b88a3a' : '#5a7a4f';
                  return (
                    <div key={c.category} className="flex items-center gap-3">
                      <div className="w-20 text-sm font-medium">{c.category}</div>
                      <div className="flex-1 h-6 bg-ink/5 dark:bg-paper/8 rounded overflow-hidden relative">
                        <div className="h-full transition-all" style={{ width: `${c.avg}%`, background: catColor, opacity: 0.18 }} />
                        <div className="h-full absolute top-0 left-0" style={{ width: `${c.avg}%`, borderRight: `2px solid ${catColor}` }} />
                        <div className="absolute inset-0 flex items-center px-2 text-xs">
                          <span className="font-serif font-medium tabular-nums">{c.avg.toFixed(1)}%</span>
                          <span className="ml-2 text-ink/55 dark:text-paper/55">avg · {c.count} {c.count === 1 ? 'session' : 'sessions'} · best {c.best.toFixed(1)}%</span>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </>
      )}
    </Card>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// QUESTION VOLUME — analytics for raw question counts across the review period
// Complements the score view: scores tell you accuracy, this tells you volume.
// ─────────────────────────────────────────────────────────────────────────────

function QuestionVolume({ planProgress }) {
  const isDark = typeof document !== 'undefined' && document.documentElement.classList.contains('dark');

  const sessionsWithQ = useMemo(() => {
    const out = [];
    for (const d of STUDY_SCHEDULE) {
      const prog = planProgress[d.date];
      if (prog?.questionsAnswered != null && prog.questionsAnswered > 0) {
        out.push({
          date: d.date,
          dateObj: new Date(d.date + 'T00:00:00'),
          questions: prog.questionsAnswered,
          category: categorizeForScore(d),
          topic: d.topic,
          target: d.qTarget,
          targetMax: d.qMax,
        });
      }
    }
    out.sort((a, b) => a.date.localeCompare(b.date));
    return out;
  }, [planProgress]);

  const count = sessionsWithQ.length;
  const totalQ = sessionsWithQ.reduce((s, x) => s + x.questions, 0);
  const avgPerSession = count > 0 ? totalQ / count : 0;
  const best = count > 0 ? Math.max(...sessionsWithQ.map(x => x.questions)) : 0;

  // Last 7 days of activity (calendar days, not just logged days)
  const recentQ = useMemo(() => {
    const today = new Date(); today.setHours(0,0,0,0);
    let sum = 0;
    for (let i = 0; i < 7; i++) {
      const d = new Date(today); d.setDate(d.getDate() - i);
      const key = todayKey(d);
      const prog = planProgress[key];
      if (prog?.questionsAnswered) sum += prog.questionsAnswered;
    }
    return sum;
  }, [planProgress]);

  // By category breakdown
  const byCategory = useMemo(() => {
    const groups = {};
    for (const d of sessionsWithQ) {
      if (!groups[d.category]) groups[d.category] = [];
      groups[d.category].push(d.questions);
    }
    return Object.entries(groups).map(([cat, qs]) => ({
      category: cat,
      count: qs.length,
      total: qs.reduce((s, x) => s + x, 0),
      avg: qs.reduce((s, x) => s + x, 0) / qs.length,
    })).sort((a, b) => b.total - a.total);
  }, [sessionsWithQ]);

  // Chart geometry
  const W = 600;
  const H = 220;
  const PADDING = { top: 20, right: 24, bottom: 36, left: 40 };
  const innerW = W - PADDING.left - PADDING.right;
  const innerH = H - PADDING.top - PADDING.bottom;
  const maxBarValue = count > 0 ? Math.max(best, 30) : 30; // sensible Y-axis even when low
  const xFor = (i) => count <= 1 ? PADDING.left + innerW / 2 : PADDING.left + (i / (count - 1)) * innerW;
  const yFor = (q) => PADDING.top + innerH - (q / maxBarValue) * innerH;

  // Bar width — shrink for many sessions, fixed cap for few
  const barWidth = count > 0 ? Math.max(8, Math.min(28, innerW / count / 1.6)) : 16;

  const colors = {
    axis: isDark ? 'rgba(232,230,227,0.55)' : 'rgba(10,25,41,0.55)',
    grid: isDark ? 'rgba(232,230,227,0.08)' : 'rgba(10,25,41,0.08)',
    Mock: '#c14a2b',
    Practice: '#b88a3a',
    Recall: '#5a7a4f',
  };

  return (
    <Card className="p-5">
      <div className="flex items-start justify-between gap-3 mb-4 flex-wrap">
        <div>
          <h2 className="font-serif text-xl font-medium">Question volume</h2>
          <p className="text-xs text-ink/55 dark:text-paper/55 mt-1">
            How many questions you've worked across all logged sessions
          </p>
        </div>
      </div>

      {count === 0 ? (
        <div className="text-sm text-ink/60 dark:text-paper/60 py-6 text-center">
          Log a question count on any session (Plan → Today) to start tracking volume.
        </div>
      ) : (
        <>
          {/* Headline stats */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-5">
            <div>
              <div className="text-xs uppercase tracking-wider text-ink/50 dark:text-paper/50 font-medium">Total answered</div>
              <div className="font-serif text-3xl font-medium mt-1 tabular-nums">{totalQ}</div>
              <div className="text-xs text-ink/55 dark:text-paper/55 mt-0.5">questions all-time</div>
            </div>
            <div>
              <div className="text-xs uppercase tracking-wider text-ink/50 dark:text-paper/50 font-medium">Avg / session</div>
              <div className="font-serif text-3xl font-medium mt-1 tabular-nums">{avgPerSession.toFixed(1)}</div>
              <div className="text-xs text-ink/55 dark:text-paper/55 mt-0.5">{count} {count === 1 ? 'session' : 'sessions'}</div>
            </div>
            <div>
              <div className="text-xs uppercase tracking-wider text-ink/50 dark:text-paper/50 font-medium">Last 7 days</div>
              <div className="font-serif text-3xl font-medium mt-1 tabular-nums">{recentQ}</div>
              <div className="text-xs text-ink/55 dark:text-paper/55 mt-0.5">questions</div>
            </div>
            <div>
              <div className="text-xs uppercase tracking-wider text-ink/50 dark:text-paper/50 font-medium">Best session</div>
              <div className="font-serif text-3xl font-medium mt-1 tabular-nums">{best}</div>
              <div className="text-xs text-ink/55 dark:text-paper/55 mt-0.5">in one session</div>
            </div>
          </div>

          {/* Volume bar chart */}
          <div className="overflow-x-auto -mx-2 mb-4">
            <svg viewBox={`0 0 ${W} ${H}`} width="100%" preserveAspectRatio="xMidYMid meet" style={{ maxWidth: '100%', minWidth: 360 }}>
              {/* Y grid + labels — 4 evenly spaced ticks */}
              {[0, 0.25, 0.5, 0.75, 1.0].map((t, i) => {
                const y = PADDING.top + innerH - t * innerH;
                const labelVal = Math.round(maxBarValue * t);
                return (
                  <g key={i}>
                    <line x1={PADDING.left} y1={y} x2={W - PADDING.right} y2={y}
                      stroke={colors.grid} strokeWidth="1"
                      strokeDasharray={t === 0 ? '0' : '2 4'} />
                    <text x={PADDING.left - 6} y={y + 3} textAnchor="end" fontSize="10" fill={colors.axis} fontFamily="Inter, sans-serif">
                      {labelVal}
                    </text>
                  </g>
                );
              })}

              {/* Bars */}
              {sessionsWithQ.map((d, i) => {
                const x = xFor(i) - barWidth / 2;
                const y = yFor(d.questions);
                const h = (PADDING.top + innerH) - y;
                const fill = colors[d.category] || colors.Recall;
                return (
                  <g key={i}>
                    <rect x={x} y={y} width={barWidth} height={h} rx="2" fill={fill} opacity="0.85" />
                    <title>{`${d.dateObj.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })} · ${d.category}: ${d.questions} Q${d.target ? ` (target ${d.target})` : ''}`}</title>
                  </g>
                );
              })}

              {/* X-axis dates — first, middle (if enough), last */}
              {count > 0 && (
                <>
                  <text x={xFor(0)} y={H - 16} textAnchor="start" fontSize="10" fill={colors.axis} fontFamily="Inter, sans-serif">
                    {sessionsWithQ[0].dateObj.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}
                  </text>
                  {count >= 5 && (
                    <text x={xFor(Math.floor((count - 1) / 2))} y={H - 16} textAnchor="middle" fontSize="10" fill={colors.axis} fontFamily="Inter, sans-serif">
                      {sessionsWithQ[Math.floor((count - 1) / 2)].dateObj.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}
                    </text>
                  )}
                  {count > 1 && (
                    <text x={xFor(count - 1)} y={H - 16} textAnchor="end" fontSize="10" fill={colors.axis} fontFamily="Inter, sans-serif">
                      {sessionsWithQ[count - 1].dateObj.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}
                    </text>
                  )}
                </>
              )}
            </svg>
          </div>

          {/* Category legend */}
          <div className="flex items-center justify-center gap-5 text-xs mb-4">
            <div className="flex items-center gap-1.5">
              <div className="w-2.5 h-2.5 rounded-sm" style={{ background: colors.Mock, opacity: 0.85 }} />
              <span className="text-ink/65 dark:text-paper/65">Mock</span>
            </div>
            <div className="flex items-center gap-1.5">
              <div className="w-2.5 h-2.5 rounded-sm" style={{ background: colors.Practice, opacity: 0.85 }} />
              <span className="text-ink/65 dark:text-paper/65">Practice</span>
            </div>
            <div className="flex items-center gap-1.5">
              <div className="w-2.5 h-2.5 rounded-sm" style={{ background: colors.Recall, opacity: 0.85 }} />
              <span className="text-ink/65 dark:text-paper/65">Recall</span>
            </div>
          </div>

          {/* By category breakdown */}
          {byCategory.length > 1 && (
            <div className="pt-4 border-t border-ink/8 dark:border-paper/8">
              <div className="text-xs uppercase tracking-widest text-ink/55 dark:text-paper/55 font-medium mb-3">By session type</div>
              <div className="space-y-2.5">
                {byCategory.map(c => {
                  const catColor = colors[c.category];
                  const sharePct = totalQ > 0 ? (c.total / totalQ) * 100 : 0;
                  return (
                    <div key={c.category} className="flex items-center gap-3">
                      <div className="w-20 text-sm font-medium">{c.category}</div>
                      <div className="flex-1 h-6 bg-ink/5 dark:bg-paper/8 rounded overflow-hidden relative">
                        <div className="h-full transition-all" style={{ width: `${sharePct}%`, background: catColor, opacity: 0.18 }} />
                        <div className="h-full absolute top-0 left-0" style={{ width: `${sharePct}%`, borderRight: `2px solid ${catColor}` }} />
                        <div className="absolute inset-0 flex items-center px-2 text-xs">
                          <span className="font-serif font-medium tabular-nums">{c.total}</span>
                          <span className="ml-2 text-ink/55 dark:text-paper/55">total · avg {c.avg.toFixed(1)}/session · {c.count} {c.count === 1 ? 'session' : 'sessions'}</span>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </>
      )}
    </Card>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// ANALYTICS
// ─────────────────────────────────────────────────────────────────────────────

function Analytics({ cards, stats, derived, planProgress }) {
  // Last 14 days of reviews
  const last14 = useMemo(() => {
    const days = [];
    for (let i = 13; i >= 0; i--) {
      const d = new Date();
      d.setHours(0,0,0,0);
      d.setDate(d.getDate() - i);
      const key = todayKey(d);
      const entry = stats.history.find(h => h.date === key);
      days.push({
        date: d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }),
        reviewed: entry?.reviewed || 0,
        accuracy: entry && entry.reviewed > 0 ? Math.round(((entry.good + entry.easy + entry.hard*0.5) / entry.reviewed) * 100) : 0,
      });
    }
    return days;
  }, [stats]);

  const topicBars = useMemo(() => {
    return derived.topicStats.filter(t => t.cards > 0).map(t => ({
      topic: t.topic.length > 14 ? t.topic.slice(0, 13) + '…' : t.topic,
      fullTopic: t.topic,
      accuracy: t.accuracy != null ? Math.round(t.accuracy * 100) : 0,
      reviews: t.reviews,
      cards: t.cards,
    }));
  }, [derived]);

  const ratingDistribution = useMemo(() => {
    const totals = { again: 0, hard: 0, good: 0, easy: 0 };
    stats.history.forEach(d => {
      totals.again += d.again || 0;
      totals.hard += d.hard || 0;
      totals.good += d.good || 0;
      totals.easy += d.easy || 0;
    });
    return [
      { name: 'Again', value: totals.again, fill: '#c14a2b' },
      { name: 'Hard', value: totals.hard, fill: '#b88a3a' },
      { name: 'Good', value: totals.good, fill: '#5a7a4f' },
      { name: 'Easy', value: totals.easy, fill: document.documentElement.classList.contains('dark') ? '#e8e6e3' : '#0a1929' },
    ];
  }, [stats]);

  const totalReviews = ratingDistribution.reduce((s, r) => s + r.value, 0);
  const accuracyAll = totalReviews > 0
    ? (ratingDistribution[2].value + ratingDistribution[3].value + ratingDistribution[1].value * 0.5) / totalReviews
    : 0;

  const isDark = document.documentElement.classList.contains('dark');
  const axisColor = isDark ? 'rgba(232,230,227,0.55)' : 'rgba(10,25,41,0.55)';
  const gridColor = isDark ? 'rgba(232,230,227,0.08)' : 'rgba(10,25,41,0.08)';
  const tooltipBg = isDark ? '#1d1e23' : '#fbf8f3';
  const tooltipBorder = isDark ? '1px solid rgba(232,230,227,0.12)' : '1px solid rgba(10,25,41,0.1)';

  return (
    <div className="fade-in space-y-5">
      <div>
        <h1 className="font-serif text-3xl md:text-4xl font-medium">Analytics</h1>
        <p className="text-ink/60 dark:text-paper/60 text-sm mt-1">Your study patterns and topic performance.</p>
      </div>

      {!RECHARTS_AVAILABLE && (
        <Card className="p-4 border-ochre/30">
          <div className="text-sm text-ink/70 dark:text-paper/70">
            <strong>Charts unavailable.</strong> The charts library failed to load from the CDN (likely an offline session or a blocked CDN). The numbers below still work — refresh with internet access to enable charts.
          </div>
        </Card>
      )}

      {/* ── SCORE PERFORMANCE ── */}
      <ScorePerformance planProgress={planProgress} />
      <QuestionVolume planProgress={planProgress} />

      {/* Section divider */}
      <div className="pt-2">
        <div className="text-xs uppercase tracking-widest text-ink/45 dark:text-paper/45 font-medium pb-1">Flashcard reviews</div>
      </div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <Stat label="Total reviews" value={totalReviews} />
        <Stat label="Overall accuracy" value={`${Math.round(accuracyAll * 100)}%`} accent={accuracyAll < 0.7} />
        <Stat label="Active days" value={stats.history.filter(h => h.reviewed > 0).length} />
        <Stat label="Cards reviewed ≥3×" value={cards.filter(c => (c.totalReviews||0) >= 3).length} sub="reliable data" />
      </div>

      <Card className="p-5">
        <h2 className="font-serif text-xl font-medium mb-4">Last 14 days</h2>
        {RECHARTS_AVAILABLE ? (
          <div style={{ width: '100%', height: 240 }}>
            <ResponsiveContainer>
              <LineChart data={last14} margin={{ top: 10, right: 10, left: -10, bottom: 0 }}>
                <CartesianGrid strokeDasharray="2 4" stroke={gridColor} />
                <XAxis dataKey="date" tick={{ fill: axisColor, fontSize: 11 }} axisLine={false} tickLine={false} />
                <YAxis tick={{ fill: axisColor, fontSize: 11 }} axisLine={false} tickLine={false} />
                <Tooltip contentStyle={{ background: tooltipBg, border: tooltipBorder, borderRadius: 8, fontSize: 12 }} />
                <Line type="monotone" dataKey="reviewed" stroke="#c14a2b" strokeWidth={2} dot={{ r: 3, fill: '#c14a2b' }} activeDot={{ r: 5 }} name="Cards reviewed" />
              </LineChart>
            </ResponsiveContainer>
          </div>
        ) : (
          <div className="grid grid-cols-7 gap-1">
            {last14.map((d, i) => {
              const max = Math.max(1, ...last14.map(x => x.reviewed));
              return (
                <div key={i} className="text-center">
                  <div className="h-16 flex items-end">
                    <div className="w-full bg-rust/70 rounded-sm" style={{ height: `${(d.reviewed / max) * 100}%`, minHeight: d.reviewed > 0 ? 2 : 0 }} />
                  </div>
                  <div className="text-[10px] text-ink/50 dark:text-paper/50 mt-1">{d.date}</div>
                  <div className="text-xs font-medium tabular-nums">{d.reviewed}</div>
                </div>
              );
            })}
          </div>
        )}
      </Card>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
        <Card className="p-5 lg:col-span-2">
          <h2 className="font-serif text-xl font-medium mb-4">Accuracy by topic</h2>
          {topicBars.length === 0 ? (
            <div className="text-sm text-ink/55 dark:text-paper/55 py-8 text-center">Not enough data yet. Review some cards.</div>
          ) : RECHARTS_AVAILABLE ? (
            <div style={{ width: '100%', height: Math.max(220, topicBars.length * 30) }}>
              <ResponsiveContainer>
                <BarChart data={topicBars} layout="vertical" margin={{ top: 5, right: 30, left: 100, bottom: 0 }}>
                  <CartesianGrid strokeDasharray="2 4" stroke={gridColor} />
                  <XAxis type="number" domain={[0, 100]} tick={{ fill: axisColor, fontSize: 11 }} axisLine={false} tickLine={false} />
                  <YAxis type="category" dataKey="topic" tick={{ fill: axisColor, fontSize: 11 }} axisLine={false} tickLine={false} width={100} />
                  <Tooltip
                    contentStyle={{ background: tooltipBg, border: tooltipBorder, borderRadius: 8, fontSize: 12 }}
                    formatter={(v, n, p) => [`${v}% (${p.payload.reviews} reviews)`, 'Accuracy']}
                    labelFormatter={(l, p) => p[0]?.payload.fullTopic || l}
                  />
                  <Bar dataKey="accuracy" radius={[0, 4, 4, 0]}>
                    {topicBars.map((entry, i) => (
                      <Cell key={i} fill={entry.accuracy < 60 ? '#c14a2b' : entry.accuracy < 80 ? '#b88a3a' : '#5a7a4f'} />
                    ))}
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
            </div>
          ) : (
            <div className="space-y-2">
              {topicBars.map(t => (
                <div key={t.fullTopic} className="flex items-center gap-3">
                  <div className="text-sm w-32 truncate">{t.fullTopic}</div>
                  <div className="flex-1 h-2 rounded-full bg-ink/8 dark:bg-paper/10 overflow-hidden">
                    <div className="h-full" style={{ width: `${t.accuracy}%`, background: t.accuracy < 60 ? '#c14a2b' : t.accuracy < 80 ? '#b88a3a' : '#5a7a4f' }} />
                  </div>
                  <div className="text-xs tabular-nums w-16 text-right text-ink/60 dark:text-paper/60">{t.accuracy}% · {t.reviews}r</div>
                </div>
              ))}
            </div>
          )}
        </Card>

        <Card className="p-5">
          <h2 className="font-serif text-xl font-medium mb-4">Ratings overall</h2>
          {totalReviews === 0 ? (
            <div className="text-sm text-ink/55 dark:text-paper/55 py-8 text-center">No reviews yet.</div>
          ) : (
            <>
              {RECHARTS_AVAILABLE && (
                <div style={{ width: '100%', height: 180 }}>
                  <ResponsiveContainer>
                    <PieChart>
                      <Pie data={ratingDistribution} dataKey="value" nameKey="name" innerRadius={45} outerRadius={70} paddingAngle={2}>
                        {ratingDistribution.map((entry, i) => <Cell key={i} fill={entry.fill} />)}
                      </Pie>
                      <Tooltip contentStyle={{ background: tooltipBg, border: tooltipBorder, borderRadius: 8, fontSize: 12 }} />
                    </PieChart>
                  </ResponsiveContainer>
                </div>
              )}
              <div className="space-y-1.5 text-sm">
                {ratingDistribution.map(r => (
                  <div key={r.name} className="flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <div className="w-2.5 h-2.5 rounded-sm" style={{ background: r.fill }} />
                      <span>{r.name}</span>
                    </div>
                    <span className="tabular-nums text-ink/60 dark:text-paper/60">{r.value} · {totalReviews > 0 ? Math.round((r.value/totalReviews)*100) : 0}%</span>
                  </div>
                ))}
              </div>
            </>
          )}
        </Card>
      </div>
    </div>
  );
}

function SettingsView({ settings, setSettings, exportJSON, exportCSV, importJSON, importCSV, cards, setCards, setStats, showToast, syncConfig, setSyncConfig, syncStatus, syncError, lastSyncedAt, manualSync, setPlanProgress }) {
  const jsonInputRef = useRef(null);
  const csvInputRef = useRef(null);
  const [syncIdDraft, setSyncIdDraft] = useState(syncConfig.syncId || '');

  const wipeAll = () => {
    const ok = confirm(
      'Delete ALL cards, stats, and review history?\n\n' +
      'This cannot be undone. Export JSON first if you want a backup.\n\n' +
      'Your settings (theme, daily goal) will be kept.'
    );
    if (!ok) return;
    setCards([]);
    setStats({ history: [] });
    setSettings(s => ({ ...s, streak: 0, lastStudyDate: null }));
    try {
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(STATS_KEY);
      localStorage.setItem(INIT_KEY, '1');
    } catch (e) { console.error('clear failed', e); }
    showToast('All cards and stats cleared');
  };

  const resetSR = () => {
    if (!confirm('Reset spaced-repetition progress on all cards? Cards stay, but all will be due today.')) return;
    setCards(prev => prev.map(c => ({
      ...c, ef: 2.5, interval: 0, reps: 0, due: Date.now(), lastReviewed: null,
      totalReviews: 0, correctReviews: 0,
    })));
    showToast('SR progress reset');
  };

  const saveSyncId = () => {
    const id = syncIdDraft.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-').replace(/-+/g, '-');
    if (!id) { showToast('Sync ID cannot be empty', 'error'); return; }
    setSyncConfig(c => ({ ...c, syncId: id, enabled: true }));
    showToast(`Sync ID set to "${id}" — syncing enabled`);
  };

  const disableSync = () => {
    setSyncConfig(c => ({ ...c, enabled: false }));
    showToast('Cloud sync disabled');
  };

  const statusColors = {
    idle:    'text-ink/50 dark:text-paper/50',
    syncing: 'text-ochre',
    synced:  'text-moss',
    error:   'text-rust',
    offline: 'text-ochre',
  };
  const statusLabels = {
    idle:    'Not configured',
    syncing: 'Syncing…',
    synced:  lastSyncedAt ? `Synced at ${new Date(lastSyncedAt).toLocaleTimeString()}` : 'Synced',
    error:   `Error: ${syncError || 'unknown'}`,
    offline: 'Offline — will sync on reconnect',
  };

  return (
    <div className="fade-in max-w-3xl mx-auto space-y-4">
      <h1 className="font-serif text-3xl md:text-4xl font-medium">Settings</h1>

      {/* ── Cloud sync ─────────────────────────────────────────────────── */}
      <Card className="p-5">
        <div className="flex items-start justify-between gap-3 mb-1">
          <h2 className="font-serif text-xl font-medium">Cloud sync</h2>
          <div className={`text-xs font-medium mt-1 ${statusColors[syncStatus] || statusColors.idle}`}>
            ● {statusLabels[syncStatus] || statusLabels.idle}
          </div>
        </div>
        <p className="text-sm text-ink/65 dark:text-paper/65 mb-4">
          Keeps your cards, review history, and plan progress in sync across all your devices automatically. Uses your Supabase project — data never touches any third-party server.
        </p>

        {/* Sync ID input */}
        <div className="space-y-3">
          <div>
            <label className="block text-xs uppercase tracking-widest text-ink/55 dark:text-paper/55 mb-1.5 font-medium">
              Sync ID <span className="opacity-60 normal-case tracking-normal font-normal">— choose any unique identifier, e.g. your name</span>
            </label>
            <div className="flex gap-2">
              <Input
                value={syncIdDraft}
                onChange={(e) => setSyncIdDraft(e.target.value)}
                placeholder="e.g. pedro-cfa-2026"
                className="flex-1 font-mono"
                onKeyDown={(e) => { if (e.key === 'Enter') saveSyncId(); }}
              />
              <Btn variant="rust" onClick={saveSyncId}>
                {syncConfig.enabled ? 'Update' : 'Enable sync'}
              </Btn>
            </div>
            <p className="text-xs text-ink/55 dark:text-paper/55 mt-1.5">
              Use the same ID on every device. Only lowercase letters, numbers, and hyphens. This is your personal row key in the database — anyone who knows it and your anon key can read your data, so don't use anything sensitive.
            </p>
          </div>

          {/* Status + actions */}
          {syncConfig.enabled && (
            <div className="flex flex-wrap gap-2 items-center pt-1">
              <Btn variant="outline" onClick={manualSync}>↻ Sync now</Btn>
              <Btn variant="ghost" onClick={disableSync}>Disable sync</Btn>
              <span className="text-xs text-ink/50 dark:text-paper/50">
                Syncs automatically 3 s after any change
              </span>
            </div>
          )}

          {syncStatus === 'error' && (
            <div className="text-xs text-rust bg-rust/8 border border-rust/20 rounded-md p-3">
              <strong>Sync failed:</strong> {syncError}<br/>
              <span className="opacity-80">Check that the SQL table was created correctly in Supabase and that your project URL and anon key are correct.</span>
            </div>
          )}

          {/* Advanced: Supabase credentials */}
          <details className="text-sm">
            <summary className="cursor-pointer text-xs text-ink/55 dark:text-paper/55 hover:text-ink dark:hover:text-paper uppercase tracking-widest font-medium">
              Advanced — Supabase credentials
            </summary>
            <div className="mt-3 space-y-3">
              <p className="text-xs text-ink/60 dark:text-paper/60">
                Your project URL and anon key are pre-filled. Only change these if you want to use a different Supabase project.
              </p>
              <div>
                <label className="block text-xs uppercase tracking-widest text-ink/55 dark:text-paper/55 mb-1.5 font-medium">Project URL</label>
                <Input
                  value={syncConfig.url || SUPABASE_DEFAULT_URL}
                  onChange={(e) => setSyncConfig(c => ({ ...c, url: e.target.value.trim() }))}
                  className="font-mono text-xs"
                  placeholder="https://xxxx.supabase.co"
                />
              </div>
              <div>
                <label className="block text-xs uppercase tracking-widest text-ink/55 dark:text-paper/55 mb-1.5 font-medium">Anon public key</label>
                <Input
                  value={syncConfig.anonKey || SUPABASE_DEFAULT_ANON}
                  onChange={(e) => setSyncConfig(c => ({ ...c, anonKey: e.target.value.trim() }))}
                  className="font-mono text-xs"
                  placeholder="eyJhbGci..."
                />
              </div>
            </div>
          </details>
        </div>
      </Card>

      {/* ── Daily goal ─────────────────────────────────────────────────── */}
      <Card className="p-5">
        <h2 className="font-serif text-xl font-medium mb-4">Daily goal</h2>
        <div className="flex items-center gap-3">
          <Input
            type="number" min="5" max="500" step="5"
            value={settings.dailyGoal}
            onChange={(e) => setSettings(s => ({ ...s, dailyGoal: parseInt(e.target.value) || 30 }))}
            className="w-32"
          />
          <span className="text-sm text-ink/65 dark:text-paper/65">cards per day</span>
        </div>
      </Card>

      {/* ── Local backup ───────────────────────────────────────────────── */}
      <Card className="p-5">
        <h2 className="font-serif text-xl font-medium mb-1">Local backup</h2>
        <p className="text-sm text-ink/65 dark:text-paper/65 mb-4">
          Export a full JSON snapshot anytime. Useful before major changes or as an offline backup. Import restores everything including plan progress.
        </p>
        <div className="flex flex-wrap gap-2">
          <Btn variant="default" onClick={exportJSON}>Export JSON</Btn>
          <Btn variant="outline" onClick={exportCSV}>Export cards as CSV</Btn>
          <Btn variant="outline" onClick={() => jsonInputRef.current?.click()}>Import JSON</Btn>
          <Btn variant="outline" onClick={() => csvInputRef.current?.click()}>Import CSV</Btn>
          <input ref={jsonInputRef} type="file" accept=".json,application/json" hidden
            onChange={(e) => e.target.files?.[0] && importJSON(e.target.files[0])} />
          <input ref={csvInputRef} type="file" accept=".csv,text/csv" hidden
            onChange={(e) => e.target.files?.[0] && importCSV(e.target.files[0])} />
        </div>
        <div className="mt-3 text-xs text-ink/55 dark:text-paper/55">
          CSV format: <code className="bg-ink/5 dark:bg-paper/10 px-1 rounded">question,answer,topic,subtopic,difficulty,tags,notes,priority</code>. Multiple tags separated by semicolons.
        </div>
      </Card>

      {/* ── Theme ──────────────────────────────────────────────────────── */}
      <Card className="p-5">
        <h2 className="font-serif text-xl font-medium mb-4">Theme</h2>
        <div className="flex gap-2">
          <button
            onClick={() => setSettings(s => ({ ...s, theme: 'light' }))}
            className={`flex-1 p-4 rounded-lg border-2 transition ${settings.theme === 'light' ? 'border-rust' : 'border-ink/10 dark:border-paper/10'}`}>
            <div className="font-serif text-lg">Light</div>
            <div className="text-xs text-ink/55 dark:text-paper/55 mt-1">Paper white</div>
          </button>
          <button
            onClick={() => setSettings(s => ({ ...s, theme: 'dark' }))}
            className={`flex-1 p-4 rounded-lg border-2 transition ${settings.theme === 'dark' ? 'border-rust' : 'border-ink/10 dark:border-paper/10'}`}>
            <div className="font-serif text-lg">Dark</div>
            <div className="text-xs text-ink/55 dark:text-paper/55 mt-1">Deep ink</div>
          </button>
        </div>
      </Card>

      {/* ── Danger zone ────────────────────────────────────────────────── */}
      <Card className="p-5 border-rust/30">
        <h2 className="font-serif text-xl font-medium mb-1">Danger zone</h2>
        <p className="text-sm text-ink/65 dark:text-paper/65 mb-4">Both actions are irreversible. Export first.</p>
        <div className="flex flex-wrap gap-2">
          <Btn variant="outline" onClick={resetSR}>Reset SR progress</Btn>
          <Btn variant="danger" onClick={wipeAll}>Delete everything</Btn>
        </div>
      </Card>

      {/* ── About SR ───────────────────────────────────────────────────── */}
      <Card className="p-5">
        <h2 className="font-serif text-xl font-medium mb-3">About the spaced repetition</h2>
        <p className="text-sm text-ink/70 dark:text-paper/70 leading-relaxed">
          This app uses a modified <strong>SuperMemo SM-2</strong> algorithm. Each card has an ease factor (EF, starts at 2.5),
          an interval (days until next review), and a rep count. Your rating after each card adjusts these:
        </p>
        <ul className="mt-3 space-y-1.5 text-sm text-ink/70 dark:text-paper/70">
          <li><strong>Again</strong>: reset reps, re-show this session, EF − 0.20 (min 1.3).</li>
          <li><strong>Hard</strong>: interval × 1.2, EF − 0.15.</li>
          <li><strong>Good</strong>: interval × EF (with 1d, 3d for first reps).</li>
          <li><strong>Easy</strong>: interval × EF × 1.3, EF + 0.15.</li>
        </ul>
        <p className="text-sm text-ink/70 dark:text-paper/70 mt-3 leading-relaxed">
          Intervals are capped at 180 days. Cards are "mastered" once they reach 4 successful reps with a 21+ day interval. Topics with accuracy below 70% appear in <strong>Weak areas</strong>.
        </p>
      </Card>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err, info) { console.error('App crashed:', err, info); }
  render() {
    if (this.state.err) {
      return (
        <div style={{ minHeight: '100vh', padding: '3rem 1.5rem', fontFamily: "'Inter', sans-serif", maxWidth: 720, margin: '0 auto' }}>
          <h1 style={{ fontFamily: "'Fraunces', serif", fontSize: '2rem', marginBottom: '0.5rem' }}>Something broke.</h1>
          <p style={{ color: 'rgba(10,25,41,0.65)', marginBottom: '1.5rem' }}>The app hit an unexpected error. Your saved cards are safe in localStorage. Try refreshing. If it persists, the error below will help diagnose it.</p>
          <pre style={{ background: '#f4efe6', padding: '1rem', borderRadius: 8, fontSize: '0.8rem', overflow: 'auto', whiteSpace: 'pre-wrap' }}>{String(this.state.err && (this.state.err.stack || this.state.err.message || this.state.err))}</pre>
          <button onClick={() => location.reload()} style={{ marginTop: '1rem', padding: '0.5rem 1rem', background: '#0a1929', color: '#fbf8f3', border: 0, borderRadius: 6, cursor: 'pointer' }}>Reload</button>
        </div>
      );
    }
    return this.props.children;
  }
}

try {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<ErrorBoundary><App /></ErrorBoundary>);
} catch (e) {
  if (window.__bootError) window.__bootError('React failed to mount:', e.message + '\n\n' + (e.stack || ''));
  else document.getElementById('root').innerHTML = '<div style="padding:2rem;font-family:sans-serif;"><h1>App failed to start</h1><pre>' + (e.stack || e.message) + '</pre></div>';
}
</script>

<script>
  // Boot sequence: wait for all critical libraries (with CDN fallbacks) to
  // finish loading, then transpile the type="text/babel-app" script with
  // Babel and execute it.
  (function () {
    function update(msg) {
      var el = document.getElementById('boot-status');
      if (el) el.textContent = msg;
    }
    function fail(msg, detail) {
      if (window.__bootError) window.__bootError(msg, detail);
      else {
        document.getElementById('root').innerHTML =
          '<div style="padding:2rem;font-family:sans-serif;max-width:720px;margin:0 auto;"><h1>' + msg + '</h1><pre style="background:#f4efe6;padding:1rem;border-radius:8px;overflow:auto;white-space:pre-wrap;font-size:0.8rem;">' + (detail || '') + '</pre></div>';
      }
    }

    update('Loading React…');
    window.__libsReady
      .then(function () {
        if (typeof React === 'undefined') throw new Error('React did not become available after loading');
        if (typeof ReactDOM === 'undefined') throw new Error('ReactDOM did not become available after loading');
        if (typeof Babel === 'undefined') throw new Error('Babel did not become available after loading');
        update('Compiling app…');
        // Find the app script
        var scripts = document.querySelectorAll('script[type="text/babel-app"]');
        if (!scripts.length) throw new Error('App source script not found in document');
        for (var i = 0; i < scripts.length; i++) {
          var src = scripts[i].textContent;
          var compiled;
          try {
            compiled = Babel.transform(src, { presets: ['react'] }).code;
          } catch (e) {
            throw new Error('Babel transform failed: ' + e.message);
          }
          // Execute the compiled code in the global scope
          var fn = new Function(compiled);
          fn();
        }
      })
      .catch(function (err) {
        fail('App failed to start', (err && (err.stack || err.message)) || String(err) + '\n\nIf you are offline, this app needs an internet connection on first load to fetch React. Once loaded once, your browser will cache the libraries and it will work offline thereafter.');
      });
  })();
</script>
