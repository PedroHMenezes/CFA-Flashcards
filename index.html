<script>
  // Load critical libraries with CDN fallbacks. If jsdelivr fails or is blocked,
  // try unpkg, then cdnjs. Each loadWithFallback returns a promise that resolves
  // once any one CDN succeeds. We block on these before transpiling the app.
  window.__libsReady = (function () {
    function loadScript(url) {
      return new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = url;
        s.async = false; // preserve order
        s.crossOrigin = 'anonymous';
        s.onload = function () { resolve(url); };
        s.onerror = function () { reject(new Error('Failed: ' + url)); };
        document.head.appendChild(s);
      });
    }
    function loadWithFallback(urls, label, optional) {
      var i = 0;
      function tryNext() {
        if (i >= urls.length) {
          if (optional) { console.warn(label + ' could not be loaded from any CDN'); return Promise.resolve(); }
          return Promise.reject(new Error(label + ' could not be loaded from any CDN'));
        }
        return loadScript(urls[i++]).catch(tryNext);
      }
      return tryNext();
    }
    // Critical libraries (app cannot start without these)
    var p = loadWithFallback([
      'https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js',
      'https://unpkg.com/react@18.3.1/umd/react.production.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js',
    ], 'React')
    .then(function () { return loadWithFallback([

      'https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js',
    ], 'ReactDOM'); })
    .then(function () { return loadWithFallback([
      'https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js',
      'https://unpkg.com/@babel/standalone@7.24.7/babel.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js',
    ], 'Babel'); })
    // Optional: Recharts. App degrades gracefully if it fails.
    .then(function () { return loadWithFallback([
      'https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js',
      'https://unpkg.com/prop-types@15.8.1/prop-types.min.js',
    ], 'PropTypes', true); })

<script type="text/babel-app" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef, useReducer } = React;

// Safe Recharts destructure — if Recharts failed to load from CDN, fall back to
// placeholders so the rest of the app still works. The Analytics view will show

const Placeholder = () => null;

// Supabase project defaults (anon key is safe to embed — restricted by RLS policy)

const SUPABASE_DEFAULT_URL  = 'https://qenxbveinquirlfrdfch.supabase.co';
const SUPABASE_DEFAULT_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFlbnhidmVpbnF1aXJsZnJkZmNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MDkzOTAsImV4cCI6MjA5NDI4NTM5MH0.K5iv3q3UiIF5IdklV_2zSiyC-BByvrCbJL-_LYJulDY';

// ─────────────────────────────────────────────────────────────────────────────
// SUPABASE SYNC LAYER
// Strategy: localStorage is primary (instant, offline-capable).
// Supabase is a sync mirror — one row per syncId in the cfa_sync table.
// On load: fetch remote blob, compare updated_at, use whichever is newer.
// On change: debounced push (3 s) so we don't spam on every keystroke.
// On conflict: last-write-wins by updated_at timestamp.
// If Supabase is unreachable: app works normally, retries silently.
// ─────────────────────────────────────────────────────────────────────────────

function loadSyncConfig() {
  try {
    const raw = localStorage.getItem(SYNC_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* noop */ }
  return {
    url: SUPABASE_DEFAULT_URL,
    anonKey: SUPABASE_DEFAULT_ANON,
    syncId: '',       // user sets this once — e.g. "my-cfa-2026"
    enabled: false,   // disabled until syncId is set
  };
}

function saveSyncConfig(cfg) {
  try { localStorage.setItem(SYNC_KEY, JSON.stringify(cfg)); }
  catch (e) { /* noop */ }
}

// Low-level Supabase REST helpers — no SDK needed, plain fetch.
async function sbRequest(cfg, method, body = null) {
  const url = `${cfg.url}/rest/v1/cfa_sync`;
  const headers = {
    'apikey': cfg.anonKey,
    'Authorization': `Bearer ${cfg.anonKey}`,
    'Content-Type': 'application/json',
    'Prefer': method === 'POST' ? 'resolution=merge-duplicates,return=representation' : 'return=representation',
  };
  const res = await fetch(
    method === 'GET' ? `${url}?id=eq.${encodeURIComponent(cfg.syncId)}&select=data,updated_at` : url,
    { method, headers, body: body ? JSON.stringify(body) : null }
  );
  if (!res.ok) {
    const text = await res.text().catch(() => '');
    throw new Error(`Supabase ${method} ${res.status}: ${text.slice(0, 120)}`);
  }
  return res.status === 204 ? null : res.json();
}

// Pull latest blob from Supabase. Returns { data, updated_at } or null.
async function supabasePull(cfg) {
  const rows = await sbRequest(cfg, 'GET');
  if (!rows || rows.length === 0) return null;
  return rows[0]; // { data: {...}, updated_at: "ISO string" }
}

// Push full state blob to Supabase (upsert).
async function supabasePush(cfg, blob) {
  const now = new Date().toISOString();
  await sbRequest(cfg, 'POST', {
    id: cfg.syncId,
    data: blob,
    updated_at: now,
  });
  return now;
}

// Build a complete state blob from current React state.
function buildBlob(cards, settings, stats, planProgress) {
  return {
    cards,
    settings,
    stats,
    planProgress,
    savedAt: Date.now(),
  };
}

// ─────────────────────────────────────────────────────────────────────────────
// SM-2 SPACED REPETITION
// Modified SuperMemo-2 — battle-tested, simple, effective.
// State per card: ef (ease factor), interval (days), reps (successful reviews).
// ─────────────────────────────────────────────────────────────────────────────

function scheduleNext(card, rating) {
  // rating: 'again' | 'hard' | 'good' | 'easy'
  let { ef = 2.5, interval = 0, reps = 0 } = card;
  ef = Math.max(1.3, ef); // floor

  if (rating === 'again') {
    reps = 0;
    interval = 0; // due today, re-show in this session
    ef = Math.max(1.3, ef - 0.2);
  } else {
    if (rating === 'hard') {
      ef = Math.max(1.3, ef - 0.15);
      interval = reps === 0 ? 1 : Math.max(1, Math.round(interval * 1.2));
    } else if (rating === 'good') {
      if (reps === 0) interval = 1;
      else if (reps === 1) interval = 3;
      else interval = Math.round(interval * ef);
    } else if (rating === 'easy') {
      ef = ef + 0.15;
      if (reps === 0) interval = 3;
      else if (reps === 1) interval = 6;
      else interval = Math.round(interval * ef * 1.3);
    }
    reps += 1;
  }
  // Cap interval at 180 days (covers our exam window comfortably)
  interval = Math.min(180, interval);

  const now = Date.now();
  const due = interval === 0 ? now : now + interval * 24 * 60 * 60 * 1000;
  return { ef, interval, reps, due, lastReviewed: now };
}

function buildSeedDeck() {
  const now = Date.now();
  return SEED_CARDS.map((c, i) => ({
    id: uid(),
    question: c.q,
    answer: c.a,
    topic: c.topic,
    subtopic: c.subtopic || '',
    difficulty: c.difficulty || 'Medium',
    tags: c.tags || [],
    notes: '',
    priority: false,
    flagged: false,
    createdAt: now - (SEED_CARDS.length - i) * 60_000,
    updatedAt: now - (SEED_CARDS.length - i) * 60_000,
    // SR state
    ef: 2.5,
    interval: 0,
    reps: 0,
    due: now, // due today
    lastReviewed: null,
    totalReviews: 0,
    correctReviews: 0,
  }));
}

const todayKey = (d = new Date()) => {
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
};

const isDue = (card, now = Date.now()) => (card.due || 0) <= now;

const isMastered = (card) => card.reps >= 4 && card.interval >= 21;

const accuracy = (card) => {
  if (!card.totalReviews) return null;
  return card.correctReviews / card.totalReviews;
};

function formatRelative(ts) {
  if (!ts) return '—';
  const diff = ts - Date.now();
  const abs = Math.abs(diff);
  const days = Math.round(abs / 86400000);
  const hours = Math.round(abs / 3600000);
  const sign = diff >= 0 ? 'in ' : '';
  const past = diff >= 0 ? '' : ' ago';
  if (abs < 3600000) return diff >= 0 ? 'soon' : 'just now';
  if (days < 1) return `${sign}${hours}h${past}`;
  if (days < 30) return `${sign}${days}d${past}`;
  return `${sign}${Math.round(days/30)}mo${past}`;
}

// CSV
function cardsToCSV(cards) {
  const headers = ['question', 'answer', 'topic', 'subtopic', 'difficulty', 'tags', 'notes', 'priority'];
  const esc = (v) => {
    if (v == null) return '';
    const s = String(v);
    if (s.includes(',') || s.includes('"') || s.includes('\n')) {
      return '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  };
  const rows = cards.map(c => [
    c.question, c.answer, c.topic, c.subtopic, c.difficulty,
    (c.tags || []).join(';'), c.notes || '', c.priority ? '1' : '0'
  ].map(esc).join(','));
  return [headers.join(','), ...rows].join('\n');
}

function parseCSV(text) {
  // Robust enough CSV parser for quoted fields & escaped quotes
  const rows = [];
  let row = [];
  let cur = '';
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"' && text[i+1] === '"') { cur += '"'; i++; }
      else if (ch === '"') { inQuotes = false; }
      else { cur += ch; }
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ',') { row.push(cur); cur = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
        cur = ''; row = [];
        if (ch === '\r' && text[i+1] === '\n') i++;
      }
      else cur += ch;
    }
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  if (!rows.length) return [];
  const headers = rows[0].map(h => h.trim().toLowerCase());
  return rows.slice(1).filter(r => r.some(c => c)).map(r => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = r[i] || '');
    return obj;
  });
}

function detectTopic(text) {
  if (!text) return null;
  const lower = text.toLowerCase();
  for (const { topic, triggers } of TOPIC_KEYWORDS) {
    for (const t of triggers) {
      if (lower.includes(t)) return topic;
    }
  }
  return null;
}

function parseNotesToCards(text, opts = {}) {
  const defaults = {
    topic: opts.topic || 'Error Log',
    difficulty: opts.difficulty || 'Medium',
    tags: opts.tags || ['mock-review'],
    autoDetectTopic: opts.autoDetectTopic !== false,
  };

  if (!text || !text.trim()) return { cards: [], unparsed: [], stats: { lines: 0, recognized: 0 } };

  const cards = [];
  const unparsed = [];
  // Track contextual overrides: lines like "Topic: X" set the topic for following cards
  let ctxTopic = null;
  let ctxTags = null;
  let ctxDifficulty = null;

  // Normalise line endings, then split into blocks. A "block" is a group of
  // consecutive non-empty lines separated by blank lines.
  const normalised = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const blocks = normalised.split(/\n\s*\n+/).map(b => b.trim()).filter(Boolean);

  for (const block of blocks) {
    const lines = block.split('\n').map(l => l).filter(l => l.trim().length > 0);
    if (lines.length === 0) continue;

    // Check for context-setting line (must be a single line at the top of a block)
    const ctxLine = lines[0].trim();
    const topicMatch = ctxLine.match(/^Topic\s*[:=]\s*(.+)$/i);
    const tagsMatch = ctxLine.match(/^Tags?\s*[:=]\s*(.+)$/i);
    const diffMatch = ctxLine.match(/^Difficulty\s*[:=]\s*(.+)$/i);
    if (topicMatch || tagsMatch || diffMatch) {
      if (topicMatch) {
        const proposed = topicMatch[1].trim();
        ctxTopic = TOPICS.find(t => t.toLowerCase() === proposed.toLowerCase()) || proposed;
      }
      if (tagsMatch) ctxTags = tagsMatch[1].split(/[,;]/).map(s => s.trim()).filter(Boolean);
      if (diffMatch) {
        const d = diffMatch[1].trim();
        ctxDifficulty = DIFFICULTIES.find(x => x.toLowerCase() === d.toLowerCase()) || null;
      }
      // Strip the context line from this block; if nothing left, move on
      lines.shift();
      if (lines.length === 0) continue;
    }

    // Re-join remaining lines and try parsing patterns
    const remaining = lines.join('\n');

    let parsedFromBlock = parseBlock(remaining);

    if (parsedFromBlock.length === 0) {
      // Couldn't parse this block — record for the user to fix
      unparsed.push(remaining);
      continue;
    }

    for (const p of parsedFromBlock) {
      const detectedTopic = defaults.autoDetectTopic ? detectTopic(p.question + ' ' + p.answer) : null;
      cards.push({
        question: p.question.trim(),
        answer: p.answer.trim(),
        topic: ctxTopic || detectedTopic || defaults.topic,
        difficulty: ctxDifficulty || defaults.difficulty,
        tags: ctxTags || defaults.tags.slice(),
        subtopic: '',
        notes: '',
        priority: false,
        source: p.source,
      });
    }
  }

  return {
    cards,
    unparsed,
    stats: {
      blocks: blocks.length,
      recognized: cards.length,
      unparsed: unparsed.length,
    },
  };
}

// Attempts to extract one or more Q/A pairs from a block of text.
// Returns array of { question, answer, source }.
function parseBlock(block) {
  const trimmed = block.trim();
  if (!trimmed) return [];

  // Pattern A: explicit Q:/A: prefix (multi-line OK)
  // Matches Q: ... A: ..., Q. ... A. ..., Question: ... Answer: ...
  const qaRegex = /(?:^|\n)\s*(?:Q(?:uestion)?[:.\s])\s*([\s\S]+?)(?:\n|^)\s*(?:A(?:nswer)?[:.\s])\s*([\s\S]+?)(?=(?:\n\s*(?:Q(?:uestion)?[:.\s])|$))/gi;
  const qaMatches = [...trimmed.matchAll(qaRegex)];
  if (qaMatches.length > 0) {
    return qaMatches.map(m => ({
      question: m[1].trim(),
      answer: m[2].trim(),
      source: 'Q/A prefix',
    }));
  }

  // Pattern B: "::" separator (one card per line)
  if (trimmed.includes('::')) {
    const out = [];
    for (const line of trimmed.split('\n')) {
      const idx = line.indexOf('::');
      if (idx > 0) {
        const q = line.slice(0, idx).trim();
        const a = line.slice(idx + 2).trim();
        if (q && a) out.push({ question: q, answer: a, source: ':: separator' });
      }
    }
    if (out.length > 0) return out;
  }

  // Pattern C: "|" separator (one card per line, but avoid markdown tables)
  // Only fire if there's exactly one pipe per line.
  const pipeLines = trimmed.split('\n').filter(l => l.trim());
  if (pipeLines.length > 0 && pipeLines.every(l => (l.match(/\|/g) || []).length === 1)) {
    const out = [];
    for (const line of pipeLines) {
      const [q, a] = line.split('|').map(s => s.trim());
      if (q && a && q.length > 2 && a.length > 2) out.push({ question: q, answer: a, source: '| separator' });
    }
    if (out.length > 0) return out;
  }

  // Pattern D: question-mark detection.
  // First line ends with '?' → it's the question; everything else is the answer.
  const lines = trimmed.split('\n');
  if (lines[0].trim().endsWith('?') && lines.length >= 2) {
    const q = lines[0].trim();
    const a = lines.slice(1).join('\n').trim().replace(/^[-*•]\s*/gm, '').trim();
    if (q && a) return [{ question: q, answer: a, source: 'question detection' }];
  }

  // Pattern E: heading-style — line ends with ':' (and not '?')
  // Treat as front: back, where back is the rest of the block.
  if (lines.length >= 2 && lines[0].trim().endsWith(':')) {
    const q = lines[0].trim().replace(/:$/, '');
    const a = lines.slice(1).join('\n').trim();
    if (q && a) return [{ question: q, answer: a, source: 'heading: body' }];
  }

  // Pattern F: single line with "→" or "=" or "—"
  if (lines.length === 1) {
    for (const sep of [' → ', ' = ', ' — ', ' -> ', ' -- ']) {
      const idx = lines[0].indexOf(sep);
      if (idx > 0) {
        const q = lines[0].slice(0, idx).trim();
        const a = lines[0].slice(idx + sep.length).trim();
        if (q && a) return [{ question: q, answer: a, source: 'inline arrow/equals' }];
      }
    }
  }

  // Nothing matched
  return [];
}

// MAIN APP
// ─────────────────────────────────────────────────────────────────────────────

function App() {
  const [cards, setCards] = useState(() => {
    const existing = loadCards();
    const isFirstLaunch = !localStorage.getItem(INIT_KEY);
    if (isFirstLaunch && existing.length === 0) {
      const seed = buildSeedDeck();
      saveCards(seed);
      localStorage.setItem(INIT_KEY, '1');
      return seed;
    }
    // Mark as initialized so we never re-seed even if user clears everything
    if (!localStorage.getItem(INIT_KEY)) localStorage.setItem(INIT_KEY, '1');
    return existing;
  });
  const [settings, setSettings] = useState(loadSettings);
  const [stats, setStats] = useState(loadStats);
  const [planProgress, setPlanProgress] = useState(loadPlanProgress);
  const [syncConfig, setSyncConfig] = useState(loadSyncConfig);
  // syncStatus: 'idle' | 'syncing' | 'synced' | 'error' | 'offline'
  const [syncStatus, setSyncStatus] = useState('idle');
  const [syncError, setSyncError] = useState(null);
  const [lastSyncedAt, setLastSyncedAt] = useState(null);
  const [view, setView] = useState('dashboard');
  const [editingCard, setEditingCard] = useState(null);
  const [reviewFilter, setReviewFilter] = useState({ scope: 'due', topic: 'all', tag: 'all', difficulty: 'all' });
  const [toast, setToast] = useState(null);

  // Debounce timer ref for auto-push
  const pushTimerRef = useRef(null);
  // Tracks the server-side updated_at timestamp of the last blob we've seen.
  // Used by pullFromSupabase to decide whether the remote has new data.
  // 0 means "never synced from server" — first pull always applies.
  const lastKnownRemoteTsRef = useRef(0);

  // Persist locally
  useEffect(() => { saveCards(cards); }, [cards]);
  useEffect(() => { saveSettings(settings); }, [settings]);
  useEffect(() => { saveStats(stats); }, [stats]);
  useEffect(() => { savePlanProgress(planProgress); }, [planProgress]);
  useEffect(() => { saveSyncConfig(syncConfig); }, [syncConfig]);

  // Theme
  useEffect(() => {
    if (settings.theme === 'dark') document.documentElement.classList.add('dark');
    else document.documentElement.classList.remove('dark');
  }, [settings.theme]);

  // ── Sync helpers ─────────────────────────────────────────────────────────

  // Toast helper — must be defined before sync callbacks reference it
  const showToast = useCallback((msg, type = 'info') => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 2400);
  }, []);

  // Apply a remote blob to local state — called after a successful pull
  const applyBlob = useCallback((blob) => {
    if (!blob) return;
    if (Array.isArray(blob.cards)) setCards(blob.cards);
    if (blob.settings) setSettings(s => ({ ...s, ...blob.settings, theme: s.theme })); // keep local theme
    if (blob.stats) setStats(blob.stats);
    if (blob.planProgress) setPlanProgress(blob.planProgress);
  }, []);

  // Push current state to Supabase
  const pushToSupabase = useCallback(async (cfg, currentCards, currentSettings, currentStats, currentPlan) => {
    if (!cfg.enabled || !cfg.syncId) return;
    setSyncStatus('syncing');
    setSyncError(null);
    try {
      const blob = buildBlob(currentCards, currentSettings, currentStats, currentPlan);
      const serverTs = await supabasePush(cfg, blob);
      // Track the server timestamp of what we just pushed — this is the
      // "high water mark" we compare future pulls against.
      lastKnownRemoteTsRef.current = new Date(serverTs).getTime();
      setSyncStatus('synced');
      setLastSyncedAt(Date.now());
    } catch (e) {
      const isOffline = !navigator.onLine || e.message.includes('fetch');
      setSyncStatus(isOffline ? 'offline' : 'error');
      setSyncError(e.message);
    }
  }, []);

  // Pull from Supabase. Apply remote blob if the server has data we haven't
  // seen yet (server timestamp > our high-water mark). Push if remote is empty.
  const pullFromSupabase = useCallback(async (cfg, currentCards, currentSettings, currentStats, currentPlan, opts = {}) => {
    if (!cfg.enabled || !cfg.syncId) return;
    const silent = !!opts.silent;
    if (!silent) setSyncStatus('syncing');
    setSyncError(null);
    try {
      const remote = await supabasePull(cfg);
      if (!remote) {
        // No remote row yet — seed it from local state
        await pushToSupabase(cfg, currentCards, currentSettings, currentStats, currentPlan);
        return;
      }
      const remoteTs = new Date(remote.updated_at).getTime();
      const knownTs  = lastKnownRemoteTsRef.current || 0;
      // First sync on this device (knownTs === 0): always apply the remote.
      // Subsequent syncs: only apply if remote is strictly newer than what we
      // last saw — protects us from re-applying our own pushes.
      if (knownTs === 0 || remoteTs > knownTs) {
        applyBlob(remote.data);
        lastKnownRemoteTsRef.current = remoteTs;
        if (!silent && knownTs > 0) showToast('Synced — loaded latest from cloud');
      }
      setSyncStatus('synced');
      setLastSyncedAt(Date.now());
    } catch (e) {
      const isOffline = !navigator.onLine || e.message.includes('fetch');
      setSyncStatus(isOffline ? 'offline' : 'error');
      setSyncError(e.message);
    }
  }, [applyBlob, pushToSupabase, showToast]);

  // On app load: pull from Supabase if enabled
  useEffect(() => {
    if (syncConfig.enabled && syncConfig.syncId) {
      pullFromSupabase(syncConfig, cards, settings, stats, planProgress);
    }
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []); // only on mount

  // Pull again when the tab becomes visible (e.g. switching back from another
  // app on phone, or unlocking the screen). This is what makes cross-device
  // sync feel instant — open the phone, the latest data appears.
  useEffect(() => {
    if (!syncConfig.enabled || !syncConfig.syncId) return;
    const onVisible = () => {
      if (document.visibilityState === 'visible') {
        pullFromSupabase(syncConfig, cards, settings, stats, planProgress, { silent: true });
      }
    };
    const onFocus = () => onVisible();
    const onOnline = () => onVisible();
    document.addEventListener('visibilitychange', onVisible);
    window.addEventListener('focus', onFocus);
    window.addEventListener('online', onOnline);
    return () => {
      document.removeEventListener('visibilitychange', onVisible);
      window.removeEventListener('focus', onFocus);
      window.removeEventListener('online', onOnline);
    };
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [syncConfig.enabled, syncConfig.syncId]);

  // Background poll every 30s — backup for when visibility events don't fire
  // (e.g. two browser windows open side by side). Cheap: one tiny REST call.
  useEffect(() => {
    if (!syncConfig.enabled || !syncConfig.syncId) return;
    const intervalId = setInterval(() => {
      pullFromSupabase(syncConfig, cards, settings, stats, planProgress, { silent: true });
    }, 30000);
    return () => clearInterval(intervalId);
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [syncConfig.enabled, syncConfig.syncId]);

  // Debounced auto-push whenever state changes
  useEffect(() => {
    if (!syncConfig.enabled || !syncConfig.syncId) return;
    if (pushTimerRef.current) clearTimeout(pushTimerRef.current);
    pushTimerRef.current = setTimeout(() => {
      pushToSupabase(syncConfig, cards, settings, stats, planProgress);
    }, 3000);
    return () => clearTimeout(pushTimerRef.current);
  }, [cards, stats, planProgress, syncConfig, pushToSupabase, settings]);

  // Manual sync — exposed to Settings view
  const manualSync = useCallback(async () => {
    if (!syncConfig.enabled || !syncConfig.syncId) {
      showToast('Enable sync and set a Sync ID in Settings first', 'error');
      return;
    }
    await pullFromSupabase(syncConfig, cards, settings, stats, planProgress);
  }, [syncConfig, cards, settings, stats, planProgress, pullFromSupabase, showToast]);

  // ── Card operations ────────────────────────────────────────────────────────
  const addCard = useCallback((data) => {
    const now = Date.now();
    const newCard = {
      id: uid(),
      question: data.question.trim(),
      answer: data.answer.trim(),
      topic: data.topic || TOPICS[0],
      subtopic: (data.subtopic || '').trim(),
      difficulty: data.difficulty || 'Medium',
      tags: (data.tags || []).map(t => t.trim()).filter(Boolean),
      notes: (data.notes || '').trim(),
      priority: !!data.priority,
      flagged: false,
      createdAt: now,
      updatedAt: now,
      ef: 2.5,
      interval: 0,
      reps: 0,
      due: now,
      lastReviewed: null,
      totalReviews: 0,
      correctReviews: 0,
    };
    setCards(prev => [newCard, ...prev]);
    return newCard;
  }, []);

  const updateCard = useCallback((id, patch) => {
    setCards(prev => prev.map(c => c.id === id ? { ...c, ...patch, updatedAt: Date.now() } : c));
  }, []);

  const deleteCard = useCallback((id) => {
    setCards(prev => prev.filter(c => c.id !== id));
  }, []);

  const duplicateCard = useCallback((id) => {
    const c = cards.find(x => x.id === id);
    if (!c) return;
    const copy = {
      ...c, id: uid(),
      question: c.question + ' (copy)',
      createdAt: Date.now(), updatedAt: Date.now(),
      ef: 2.5, interval: 0, reps: 0, due: Date.now(),
      lastReviewed: null, totalReviews: 0, correctReviews: 0,
    };
    setCards(prev => [copy, ...prev]);
    showToast('Card duplicated');
  }, [cards, showToast]);

  // ── Plan progress ─────────────────────────────────────────────────────────
  const updatePlanDay = useCallback((dateKey, patch) => {
    setPlanProgress(prev => {
      const next = { ...prev };
      const current = next[dateKey] || {};
      next[dateKey] = { ...current, ...patch };
      // If clearing status, drop the entry to keep storage lean
      if (next[dateKey].status === undefined && !next[dateKey].notes && next[dateKey].mockScore == null && next[dateKey].questionsAnswered == null) {
        delete next[dateKey];
      }
      return next;
    });
  }, []);

  // ── Review: record rating, update SR state, update stats & streak ──────────
  const recordReview = useCallback((cardId, rating) => {
    setCards(prev => prev.map(c => {
      if (c.id !== cardId) return c;
      const sr = scheduleNext(c, rating);
      const wasCorrect = rating !== 'again';
      return {
        ...c,
        ...sr,
        totalReviews: (c.totalReviews || 0) + 1,
        correctReviews: (c.correctReviews || 0) + (wasCorrect ? 1 : 0),
        updatedAt: Date.now(),
      };
    }));

    // Update daily stats
    const card = cards.find(c => c.id === cardId);
    const key = todayKey();
    setStats(prev => {
      const history = [...prev.history];
      let entry = history.find(e => e.date === key);
      if (!entry) { entry = { date: key, reviewed: 0, again: 0, hard: 0, good: 0, easy: 0, byTopic: {} }; history.push(entry); }
      entry.reviewed += 1;
      entry[rating] += 1;
      if (card) {
        entry.byTopic[card.topic] = entry.byTopic[card.topic] || { reviewed: 0, correct: 0 };
        entry.byTopic[card.topic].reviewed += 1;
        if (rating !== 'again') entry.byTopic[card.topic].correct += 1;
      }
      // Trim to last 180 days
      history.sort((a, b) => a.date.localeCompare(b.date));
      const trimmed = history.slice(-180);
      return { history: trimmed };
    });

    // Streak
    setSettings(prev => {
      const last = prev.lastStudyDate;
      const today = todayKey();
      if (last === today) return prev;
      const yesterday = todayKey(new Date(Date.now() - 86400000));
      const newStreak = last === yesterday ? prev.streak + 1 : 1;
      return { ...prev, lastStudyDate: today, streak: newStreak };
    });
  }, [cards]);

  // ── Import / export ─────────────────────────────────────────────────────────
  const exportJSON = useCallback(() => {
    const blob = new Blob([JSON.stringify({ cards, settings, stats, planProgress, exportedAt: Date.now() }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `cfa-l3-flashcards-${todayKey()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Exported JSON');
  }, [cards, settings, stats, showToast]);

  const exportCSV = useCallback(() => {
    const blob = new Blob([cardsToCSV(cards)], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `cfa-l3-flashcards-${todayKey()}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Exported CSV');
  }, [cards, showToast]);

  const importJSON = useCallback((file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (Array.isArray(data)) {
          setCards(data);
          showToast(`Imported ${data.length} cards`);
        } else if (data.cards && Array.isArray(data.cards)) {
          setCards(data.cards);
          if (data.settings) setSettings(s => ({ ...s, ...data.settings, theme: s.theme }));
          if (data.stats) setStats(data.stats);
          if (data.planProgress) setPlanProgress(data.planProgress);
          showToast(`Imported ${data.cards.length} cards`);
        } else {
          showToast('Invalid JSON format', 'error');
        }
      } catch (err) { showToast('Failed to parse JSON', 'error'); }
    };
    reader.readAsText(file);
  }, [showToast]);

  const importCSV = useCallback((file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const rows = parseCSV(e.target.result);
        const now = Date.now();
        const newCards = rows.map((r, i) => ({
          id: uid(),
          question: r.question || r.front || '',
          answer: r.answer || r.back || '',
          topic: TOPICS.includes(r.topic) ? r.topic : (r.topic || TOPICS[0]),
          subtopic: r.subtopic || '',
          difficulty: DIFFICULTIES.includes(r.difficulty) ? r.difficulty : 'Medium',
          tags: (r.tags || '').split(/[;|]/).map(t => t.trim()).filter(Boolean),
          notes: r.notes || '',
          priority: r.priority === '1' || r.priority === 'true',
          flagged: false,
          createdAt: now - (rows.length - i),
          updatedAt: now - (rows.length - i),
          ef: 2.5, interval: 0, reps: 0, due: now,
          lastReviewed: null, totalReviews: 0, correctReviews: 0,
        })).filter(c => c.question && c.answer);
        setCards(prev => [...newCards, ...prev]);
        showToast(`Imported ${newCards.length} cards`);
      } catch (err) { showToast('Failed to parse CSV', 'error'); }
    };
    reader.readAsText(file);
  }, [showToast]);

  // ── Derived stats for dashboard ────────────────────────────────────────────
  const derived = useMemo(() => {
    const now = Date.now();
    const dueToday = cards.filter(c => isDue(c, now));
    const mastered = cards.filter(isMastered);
    const flagged = cards.filter(c => c.flagged);
    const priority = cards.filter(c => c.priority);

    // Accuracy by topic
    const byTopic = {};
    cards.forEach(c => {
      if (!byTopic[c.topic]) byTopic[c.topic] = { total: 0, correct: 0, count: 0, due: 0 };
      byTopic[c.topic].count += 1;
      byTopic[c.topic].total += (c.totalReviews || 0);
      byTopic[c.topic].correct += (c.correctReviews || 0);
      if (isDue(c, now)) byTopic[c.topic].due += 1;
    });
    const topicStats = Object.entries(byTopic).map(([topic, s]) => ({
      topic,
      cards: s.count,
      due: s.due,
      reviews: s.total,
      accuracy: s.total > 0 ? s.correct / s.total : null,
    })).sort((a, b) => a.topic.localeCompare(b.topic));

    // Weak topics: those with accuracy < 0.7 and >= 3 reviews
    const weakTopics = topicStats.filter(t => t.accuracy != null && t.accuracy < 0.7 && t.reviews >= 3)
      .sort((a, b) => (a.accuracy || 0) - (b.accuracy || 0));

    // Upcoming load: next 7 days
    const upcoming = Array.from({ length: 7 }, (_, i) => {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() + i);
      const start = d.getTime();
      const end = start + 86400000;
      return {
        day: d.toLocaleDateString(undefined, { weekday: 'short' }),
        date: d.getDate(),
        count: cards.filter(c => c.due >= start && c.due < end).length,
      };
    });

    return { dueToday, mastered, flagged, priority, topicStats, weakTopics, upcoming };
  }, [cards]);

  // ── Keyboard shortcuts: global nav ────────────────────────────────────────
  useEffect(() => {
    const handler = (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'd') setView('dashboard');
      else if (e.key === 'p') setView('plan');
      else if (e.key === 'r') setView('review');
      else if (e.key === 'b') setView('browse');
      else if (e.key === 'n') { setEditingCard(null); setView('create'); }
      else if (e.key === 'a') setView('analytics');
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);

  // ── Render ────────────────────────────────────────────────────────────────
  return (
    <div className="min-h-screen paper-grain">
      <Nav view={view} setView={setView} settings={settings} setSettings={setSettings} dueCount={derived.dueToday.length} syncStatus={syncStatus} syncError={syncError} lastSyncedAt={lastSyncedAt} />

      <main className="max-w-6xl mx-auto px-4 sm:px-6 pb-24 pt-6">
        {view === 'dashboard' && (
          <Dashboard
            cards={cards} derived={derived} settings={settings} stats={stats}
            planProgress={planProgress}
            setView={setView} setReviewFilter={setReviewFilter}
            setEditingCard={setEditingCard}
          />
        )}
        {view === 'review' && (
          <Review
            cards={cards} recordReview={recordReview}
            filter={reviewFilter} setFilter={setReviewFilter}
            updateCard={updateCard}
            setView={setView}
            settings={settings}
          />
        )}
        {view === 'browse' && (
          <Browse
            cards={cards} updateCard={updateCard} deleteCard={deleteCard} duplicateCard={duplicateCard}
            setEditingCard={setEditingCard} setView={setView}
          />
        )}
        {view === 'create' && (
          <Create
            addCard={addCard} updateCard={updateCard}
            editingCard={editingCard} setEditingCard={setEditingCard}
            setView={setView} showToast={showToast}
          />
        )}
        {view === 'plan' && (
          <Plan
            planProgress={planProgress} updatePlanDay={updatePlanDay}
            setView={setView} setReviewFilter={setReviewFilter}
            showToast={showToast}
          />
        )}
        {view === 'analytics' && (
          <Analytics cards={cards} stats={stats} derived={derived} planProgress={planProgress} />
        )}
        {view === 'settings' && (
          <SettingsView
            settings={settings} setSettings={setSettings}
            exportJSON={exportJSON} exportCSV={exportCSV}
            importJSON={importJSON} importCSV={importCSV}
            cards={cards} setCards={setCards} setStats={setStats}
            showToast={showToast}
            syncConfig={syncConfig} setSyncConfig={setSyncConfig}
            syncStatus={syncStatus} syncError={syncError} lastSyncedAt={lastSyncedAt}
            manualSync={manualSync} setPlanProgress={setPlanProgress}
          />
        )}
      </main>

      {toast && (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-lg bg-ink text-paper dark:bg-paper dark:text-ink text-sm font-medium card-shadow fade-in z-50">
          {toast.msg}
        </div>
      )}

      <footer className="border-t border-ink/8 dark:border-paper/8 mt-12 py-6 px-4 sm:px-6">
        <div className="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-4 text-xs text-ink/50 dark:text-paper/50">
          <div>CFA L3 Flashcards · Local-first · Your data stays in your browser.</div>
          <div className="flex items-center gap-3">
            <span>Shortcuts: <kbd className="px-1.5 py-0.5 rounded bg-ink/5 dark:bg-paper/10 font-mono">d</kbd> <kbd className="px-1.5 py-0.5 rounded bg-ink/5 dark:bg-paper/10 font-mono">p</kbd> <kbd className="px-1.5 py-0.5 rounded bg-ink/5 dark:bg-paper/10 font-mono">r</kbd> <kbd className="px-1.5 py-0.5 rounded bg-ink/5 dark:bg-paper/10 font-mono">b</kbd> <kbd className="px-1.5 py-0.5 rounded bg-ink/5 dark:bg-paper/10 font-mono">n</kbd> <kbd className="px-1.5 py-0.5 rounded bg-ink/5 dark:bg-paper/10 font-mono">a</kbd></span>
          </div>
        </div>
      </footer>
    </div>
  );
}

function Nav({ view, setView, settings, setSettings, dueCount, syncStatus, syncError, lastSyncedAt }) {
  const items = [
    { key: 'dashboard', label: 'Dashboard' },
    { key: 'plan', label: 'Plan' },
    { key: 'review', label: 'Review', badge: dueCount },
    { key: 'browse', label: 'Browse' },
    { key: 'create', label: 'Create' },
    { key: 'analytics', label: 'Analytics' },
  ];

  // Sync indicator config
  const syncDot = {
    idle:    { color: 'bg-ink/20 dark:bg-paper/20', title: 'Sync not configured' },
    syncing: { color: 'bg-ochre animate-pulse', title: 'Syncing…' },
    synced:  { color: 'bg-moss', title: lastSyncedAt ? `Synced ${new Date(lastSyncedAt).toLocaleTimeString()}` : 'Synced' },
    error:   { color: 'bg-rust', title: `Sync error: ${syncError || 'unknown'}` },
    offline: { color: 'bg-ochre', title: 'Offline — will sync when connection returns' },
  }[syncStatus] || { color: 'bg-ink/20 dark:bg-paper/20', title: '' };

  return (
    <header className="border-b border-ink/8 dark:border-paper/8 bg-paper/85 dark:bg-ink/85 backdrop-blur-md sticky top-0 z-40">
      <div className="max-w-6xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between gap-4">
        <button onClick={() => setView('dashboard')} className="flex items-center gap-2.5 group">
          <div className="nav-logo w-7 h-7 rounded-md bg-ink flex items-center justify-center font-serif text-paper font-semibold text-sm">3</div>
          <div>
            <div className="font-serif text-base font-medium leading-none">CFA Level III</div>
            <div className="text-[10px] uppercase tracking-widest text-ink/50 dark:text-paper/50 mt-0.5">flashcards</div>
          </div>
        </button>
        <nav className="hidden md:flex items-center gap-7">
          {items.map(it => (
            <button key={it.key} onClick={() => setView(it.key)}
              className={`nav-link text-sm font-medium transition ${view === it.key ? 'text-ink dark:text-paper active' : 'text-ink/55 dark:text-paper/55 hover:text-ink dark:hover:text-paper'}`}>
              {it.label}
              {it.badge > 0 && (
                <span className="ml-1.5 inline-flex items-center justify-center min-w-[18px] h-[18px] px-1.5 rounded-full bg-rust text-paper text-[10px] font-semibold">
                  {it.badge}
                </span>
              )}
            </button>
          ))}
        </nav>
        <div className="flex items-center gap-2">
          {/* Sync status dot — click to go to settings */}
          <button onClick={() => setView('settings')} title={syncDot.title}
            className="flex items-center gap-1.5 p-1.5 rounded-md hover:bg-paper-2 dark:hover:bg-ink-soft transition">
            <div className={`w-2 h-2 rounded-full ${syncDot.color}`} />
            <span className="text-xs text-ink/50 dark:text-paper/50 hidden lg:inline">
              {syncStatus === 'synced' ? 'synced' : syncStatus === 'syncing' ? 'syncing…' : syncStatus === 'error' ? 'sync error' : syncStatus === 'offline' ? 'offline' : ''}
            </span>
          </button>
          <button
            onClick={() => setSettings(s => ({ ...s, theme: s.theme === 'dark' ? 'light' : 'dark' }))}
            className="p-2 rounded-md hover:bg-paper-2 dark:hover:bg-ink-soft transition"
            title="Toggle theme"
          >
            {settings.theme === 'dark' ? '☀' : '☾'}
          </button>
          <button onClick={() => setView('settings')} className="p-2 rounded-md hover:bg-paper-2 dark:hover:bg-ink-soft transition" title="Settings">⚙</button>
        </div>
      </div>
      {/* Mobile nav */}
      <div className="md:hidden border-t border-ink/8 dark:border-paper/8 overflow-x-auto">
        <div className="flex">
          {items.map(it => (
            <button key={it.key} onClick={() => setView(it.key)}
              className={`flex-1 min-w-fit py-2.5 px-3 text-xs font-medium transition ${view === it.key ? 'text-rust border-b-2 border-rust' : 'text-ink/60 dark:text-paper/60'}`}>
              {it.label}
              {it.badge > 0 && <span className="ml-1 text-rust">·{it.badge}</span>}
            </button>
          ))}
        </div>
      </div>
    </header>
  );
}

// DASHBOARD

function Dashboard({ cards, derived, settings, stats, planProgress, setView, setReviewFilter, setEditingCard }) {
  const examDate = new Date('2026-08-14');
  const daysToExam = Math.max(0, Math.ceil((examDate - new Date()) / 86400000));

  const todayReviewed = useMemo(() => {
    const e = stats.history.find(h => h.date === todayKey());
    return e ? e.reviewed : 0;
  }, [stats]);

  const goalPct = Math.min(100, Math.round((todayReviewed / settings.dailyGoal) * 100));

  // Today's study plan info
  const todayPlanIdx = useMemo(() => findTodayIndex(), []);
  const todayPlan = todayPlanIdx >= 0 && todayPlanIdx < STUDY_SCHEDULE.length ? STUDY_SCHEDULE[todayPlanIdx] : null;
  const todayPlanProgress = todayPlan ? planProgress[todayPlan.date] : null;

  const recentCards = useMemo(() =>
    [...cards].sort((a,b) => b.createdAt - a.createdAt).slice(0, 5),
    [cards]
  );

  const startReview = (scope) => {
    setReviewFilter({ scope, topic: 'all', tag: 'all', difficulty: 'all' });
    setView('review');
  };

  return (
    <div className="space-y-6 fade-in">
      {/* Hero */}
      <div className="flex flex-col md:flex-row md:items-end md:justify-between gap-4 pb-2">
        <div>
          <div className="text-xs uppercase tracking-widest text-ink/50 dark:text-paper/50 mb-1.5">
            {new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' })}
          </div>
          <h1 className="font-serif text-4xl md:text-5xl font-medium tracking-tight">
            {derived.dueToday.length > 0
              ? <>You have <span className="text-rust">{derived.dueToday.length}</span> {derived.dueToday.length === 1 ? 'card' : 'cards'} due.</>
              : <>All caught up.<span className="text-ink/40 dark:text-paper/40"> Nothing due today.</span></>}
          </h1>
          <p className="mt-2 text-ink/60 dark:text-paper/60 text-sm">
            {daysToExam} days until exam · {settings.streak} day streak · {todayReviewed}/{settings.dailyGoal} reviews today
          </p>
        </div>
        <div className="flex gap-2">
          <Btn variant="rust" onClick={() => startReview('due')} disabled={derived.dueToday.length === 0}>
            ▶ Review due ({derived.dueToday.length})
          </Btn>
          <Btn variant="outline" onClick={() => { setEditingCard(null); setView('create'); }}>+ New card</Btn>
        </div>
      </div>

      {/* Today's study plan (only shown during plan window) */}
      {(() => {
        // Pre-start: show a compact card pointing to the first session
        if (todayPlanIdx < 0) {
          const firstDay = STUDY_SCHEDULE[0];
          const daysToStart = Math.max(0, Math.ceil((new Date(STUDY_PLAN_START) - new Date()) / 86400000));
          const firstDateLabel = (() => {
            const d = new Date(firstDay.date + 'T00:00:00');
            return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
          })();
          return (
            <Card className="overflow-hidden">
              <div className="px-5 py-2.5 flex items-center justify-between gap-2 flex-wrap bg-ochre/10 border-b border-ink/8 dark:border-paper/8">
                <div className="flex items-center gap-2 flex-wrap">
                  <div className="text-[10px] uppercase tracking-widest font-medium text-ink/65 dark:text-paper/65">Study plan</div>
                  <Pill color="ochre">
                    {daysToStart === 0 ? 'Starts today' : `Starts in ${daysToStart}d`}
                  </Pill>
                </div>
              </div>
              <div className="p-5">
                <div className="font-serif text-xl md:text-2xl font-medium leading-snug mb-1">
                  Plan hasn't started yet.
                </div>
                <div className="text-sm text-ink/65 dark:text-paper/65 leading-relaxed">
                  Use these days to build your deck and warm up.
                </div>
                <div className="mt-4 pt-4 border-t border-ink/8 dark:border-paper/8">
                  <div className="text-[10px] uppercase tracking-widest text-ink/50 dark:text-paper/50 font-medium mb-1.5">First session</div>
                  <div className="font-serif text-base font-medium leading-snug">{firstDay.topic}</div>
                  <div className="text-xs text-ink/55 dark:text-paper/55 mt-0.5">
                    {firstDateLabel} · {firstDay.hours}h · {firstDay.sessionType}
                  </div>
                </div>
                <div className="mt-4 flex justify-end">
                  <Btn variant="ghost" onClick={() => setView('plan')}>View plan →</Btn>
                </div>
              </div>
            </Card>
          );
        }

        // Post-plan: nothing to show
        if (!todayPlan) return null;

        // In-plan: original logic
        const style = getPhaseStyle(todayPlan.phase);
        const isRest = todayPlan.phase === 'Rest';
        const isExam = todayPlan.phase === 'Exam day';
        const status = todayPlanProgress?.status;
        const isTodayWorkDone = status === 'done' || isRest;

        // Find the next actual study session after today (skip rest days)
        let nextStudy = null;
        for (let i = todayPlanIdx + 1; i < STUDY_SCHEDULE.length; i++) {
          const d = STUDY_SCHEDULE[i];
          if (d.phase === 'Rest' || d.phase === 'Exam day') continue;
          nextStudy = { ...d, idxOffset: i - todayPlanIdx };
          break;
        }

        // Build the headline + optional next-session preview
        let headline, sub, statusPill;
        if (isExam) {
          headline = 'Exam day.';
          sub = 'You\'ve prepared. Trust the work.';
          statusPill = null;
        } else if (status === 'done') {
          headline = 'Already done for today.';
          sub = `Nicely paced. ${todayPlan.hours}h logged on ${todayPlan.topic.split(':')[0]}.`;
          statusPill = { color: 'moss', label: '✓ Completed' };
        } else if (status === 'skipped') {
          headline = 'Today was skipped.';
          sub = 'Get back to it tomorrow — one day off is fine, two starts a pattern.';
          statusPill = { color: 'ochre', label: '↷ Skipped' };
        } else if (isRest) {
          headline = 'Rest day — recover.';
          sub = 'No study work scheduled. Your next session is below.';
          statusPill = null;
        } else {
          // Pending study day
          headline = `Next step: ${todayPlan.topic.split(':')[0]}`;
          sub = todayPlan.activity || todayPlan.sessionType;
          statusPill = { color: 'rust', label: `${todayPlan.hours}h` };
        }

        // Format the next-session date
        const nextDateLabel = nextStudy
          ? (() => {
              const d = new Date(nextStudy.date + 'T00:00:00');
              const offsetText = nextStudy.idxOffset === 1 ? 'Tomorrow' : `In ${nextStudy.idxOffset} days`;
              return `${offsetText} · ${d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })}`;
            })()
          : null;

        return (
          <Card className="overflow-hidden">
            {/* Top strip */}
            <div className={`px-5 py-2.5 flex items-center justify-between gap-2 flex-wrap ${style.bg} border-b border-ink/8 dark:border-paper/8`}>
              <div className="flex items-center gap-2 flex-wrap">
                <div className="text-[10px] uppercase tracking-widest font-medium text-ink/65 dark:text-paper/65">Today's plan</div>
                <Pill color={isExam ? 'rust' : todayPlan.mock ? 'ochre' : isRest ? 'default' : 'moss'}>{todayPlan.phase}</Pill>
              </div>
              {statusPill && <Pill color={statusPill.color}>{statusPill.label}</Pill>}
            </div>

            {/* Headline */}
            <div className="p-5">
              <div className="font-serif text-xl md:text-2xl font-medium leading-snug mb-1">
                {headline}
              </div>
              {sub && <div className="text-sm text-ink/65 dark:text-paper/65 leading-relaxed">{sub}</div>}

              {/* Next-session preview, shown when today is done/skipped/rest */}
              {isTodayWorkDone && nextStudy && (
                <div className="mt-4 pt-4 border-t border-ink/8 dark:border-paper/8">
                  <div className="text-[10px] uppercase tracking-widest text-ink/50 dark:text-paper/50 font-medium mb-1.5">Next session</div>
                  <div className="flex items-start justify-between gap-3 flex-wrap">
                    <div className="flex-1 min-w-0">
                      <div className="font-serif text-base font-medium leading-snug">{nextStudy.topic}</div>
                      <div className="text-xs text-ink/55 dark:text-paper/55 mt-0.5">
                        {nextDateLabel} · {nextStudy.hours}h · {nextStudy.sessionType}
                      </div>
                    </div>
                    {nextStudy.mock && <Pill color="rust">{nextStudy.mock}</Pill>}
                  </div>
                </div>
              )}

              {/* Single action */}
              <div className="mt-4 flex justify-end">
                <Btn variant={isTodayWorkDone || isExam ? 'ghost' : 'rust'} onClick={() => setView('plan')}>
                  {isTodayWorkDone ? 'View plan →' : 'Open plan →'}
                </Btn>
              </div>
            </div>
          </Card>
        );
      })()}

      {/* Daily goal progress */}
      <Card className="p-5">
        <div className="flex items-center justify-between mb-2.5">
          <div className="text-sm font-medium">Daily goal</div>
          <div className="text-xs text-ink/55 dark:text-paper/55">{todayReviewed} / {settings.dailyGoal}</div>
        </div>
        <div className="h-2 rounded-full bg-ink/8 dark:bg-paper/10 overflow-hidden">
          <div
            className="h-full bg-rust transition-all duration-500"
            style={{ width: `${goalPct}%` }}
          />
        </div>
      </Card>

      {/* Stat grid */}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4">
        <Stat label="Total cards" value={cards.length} sub={`${derived.priority.length} high priority`} />
        <Stat label="Due today" value={derived.dueToday.length} sub={derived.dueToday.length > 0 ? "Start reviewing" : "Nothing pending"} accent={derived.dueToday.length > 0} />
        <Stat label="Mastered" value={derived.mastered.length} sub={`${Math.round(derived.mastered.length / Math.max(1, cards.length) * 100)}% of deck`} />
        <Stat label="Streak" value={`${settings.streak}d`} sub={settings.streak >= 7 ? 'On fire 🔥' : 'Keep going'} />
      </div>

      {/* Two-column layout */}
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 md:gap-6">
        {/* Left: Weak topics */}
        <Card className="p-5 lg:col-span-2">
          <div className="flex items-center justify-between mb-4">
            <h2 className="font-serif text-xl font-medium">Weak areas</h2>
            <button
              onClick={() => startReview('weak')}
              className="text-xs text-rust hover:underline font-medium"
              disabled={derived.weakTopics.length === 0}
            >
              Review weak →
            </button>
          </div>
          {derived.weakTopics.length === 0 ? (
            <div className="text-sm text-ink/55 dark:text-paper/55 py-4">
              No weak topics yet. Keep reviewing — topics with accuracy below 70% will surface here.
            </div>
          ) : (
            <div className="space-y-2.5">
              {derived.weakTopics.slice(0, 6).map(t => (
                <div key={t.topic} className="flex items-center justify-between gap-3">
                  <div className="font-medium text-sm truncate">{t.topic}</div>
                  <div className="flex items-center gap-3 flex-shrink-0">
                    <div className="w-24 md:w-40 h-1.5 rounded-full bg-ink/8 dark:bg-paper/10 overflow-hidden">
                      <div className="h-full bg-rust" style={{ width: `${(t.accuracy || 0) * 100}%` }} />
                    </div>
                    <div className="text-xs text-ink/60 dark:text-paper/60 tabular-nums w-12 text-right">{Math.round((t.accuracy || 0) * 100)}%</div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </Card>

        {/* Right: Upcoming load */}
        <Card className="p-5">
          <h2 className="font-serif text-xl font-medium mb-4">Next 7 days</h2>
          <div className="space-y-1.5">
            {derived.upcoming.map((d, i) => (
              <div key={i} className="flex items-center gap-3">
                <div className="text-xs uppercase tracking-wider text-ink/55 dark:text-paper/55 w-10">{d.day}</div>
                <div className="flex-1 h-5 bg-ink/5 dark:bg-paper/8 rounded overflow-hidden relative">
                  <div className="h-full bg-ink/20 dark:bg-paper/25" style={{ width: `${Math.min(100, d.count * 4)}%` }} />
                  <div className="absolute inset-0 flex items-center px-2 text-xs font-medium tabular-nums">{d.count}</div>
                </div>
              </div>
            ))}
          </div>
        </Card>
      </div>

      {/* Topic snapshot */}
      <Card className="p-5">
        <div className="flex items-center justify-between mb-4">
          <h2 className="font-serif text-xl font-medium">By topic</h2>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-2">
          {derived.topicStats.filter(t => t.cards > 0).map(t => (
            <button
              key={t.topic}
              onClick={() => { setReviewFilter({ scope: 'all', topic: t.topic, tag: 'all', difficulty: 'all' }); setView('review'); }}
              className="flex items-center justify-between py-1.5 text-left hover:bg-paper-2 dark:hover:bg-ink/40 rounded px-2 -mx-2 transition"
            >
              <div className="text-sm truncate pr-2">{t.topic}</div>
              <div className="flex items-center gap-2 flex-shrink-0">
                {t.due > 0 && <Pill color="rust">{t.due} due</Pill>}
                <div className="text-xs text-ink/55 dark:text-paper/55 tabular-nums">{t.cards}</div>
              </div>
            </button>
          ))}
        </div>
      </Card>

      {/* Recent cards */}
      {recentCards.length > 0 && (
        <Card className="p-5">
          <div className="flex items-center justify-between mb-3">
            <h2 className="font-serif text-xl font-medium">Recently created</h2>
            <button onClick={() => setView('browse')} className="text-xs text-rust hover:underline font-medium">Browse all →</button>
          </div>
          <div className="space-y-2">
            {recentCards.map(c => (
              <div key={c.id} className="flex items-start gap-3 py-2 border-b border-ink/5 dark:border-paper/5 last:border-0">
                <Pill>{c.topic}</Pill>
                <div className="text-sm flex-1 truncate text-ink/85 dark:text-paper/85">{c.question}</div>
                <div className="text-xs text-ink/45 dark:text-paper/45 flex-shrink-0">{formatRelative(c.createdAt)}</div>
              </div>
            ))}
          </div>
        </Card>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// REVIEW
// ─────────────────────────────────────────────────────────────────────────────

function Review({ cards, recordReview, filter, setFilter, updateCard, setView, settings }) {
  const [revealed, setRevealed] = useState(false);
  const [sessionQueue, setSessionQueue] = useState([]); // ids
  const [sessionLog, setSessionLog] = useState([]); // {id, rating}
  const [startTime, setStartTime] = useState(null);
  const [elapsed, setElapsed] = useState(0);

  // Build queue when filter changes or cards change (only on session start)
  useEffect(() => {
    const now = Date.now();
    let pool = cards;
    if (filter.scope === 'due') pool = pool.filter(c => isDue(c, now));
    else if (filter.scope === 'weak') {
      pool = pool.filter(c => {
        const a = accuracy(c);
        return (a != null && a < 0.7) || c.priority || c.flagged;
      });
    }
    else if (filter.scope === 'random') {
      pool = [...pool].sort(() => Math.random() - 0.5);
    }
    else if (filter.scope === 'priority') pool = pool.filter(c => c.priority);
    else if (filter.scope === 'flagged') pool = pool.filter(c => c.flagged);

    if (filter.topic !== 'all') pool = pool.filter(c => c.topic === filter.topic);
    if (filter.difficulty !== 'all') pool = pool.filter(c => c.difficulty === filter.difficulty);
    if (filter.tag !== 'all') pool = pool.filter(c => (c.tags || []).includes(filter.tag));

    // Sort: due first (oldest due first), then by priority
    pool.sort((a, b) => {
      if (a.due !== b.due) return a.due - b.due;
      if (a.priority !== b.priority) return a.priority ? -1 : 1;
      return 0;
    });

    setSessionQueue(pool.map(c => c.id));
    setSessionLog([]);
    setRevealed(false);
    setStartTime(Date.now());
    // eslint-disable-next-line
  }, [filter.scope, filter.topic, filter.tag, filter.difficulty]);

  // Timer
  useEffect(() => {
    if (!startTime) return;
    const id = setInterval(() => setElapsed(Math.floor((Date.now() - startTime) / 1000)), 1000);
    return () => clearInterval(id);
  }, [startTime]);

  const currentId = sessionQueue[0];
  const currentCard = cards.find(c => c.id === currentId);
  const remaining = sessionQueue.length;
  const completed = sessionLog.length;

  const rate = useCallback((rating) => {
    if (!currentCard) return;
    recordReview(currentCard.id, rating);
    setSessionLog(prev => [...prev, { id: currentCard.id, rating, topic: currentCard.topic }]);

    setSessionQueue(prev => {
      const [head, ...rest] = prev;
      // If 'again', re-queue near the end so the user sees it again this session
      if (rating === 'again') {
        const insertAt = Math.min(rest.length, 4);
        const reinsert = [...rest.slice(0, insertAt), head, ...rest.slice(insertAt)];
        return reinsert;
      }
      return rest;
    });
    setRevealed(false);
  }, [currentCard, recordReview]);

  // Keyboard shortcuts in review
  useEffect(() => {
    const handler = (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
      if (e.metaKey || e.ctrlKey) return;
      if (!currentCard) return;
      if (e.code === 'Space' || e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        setRevealed(r => !r);
      } else if (revealed) {
        if (e.key === '1') rate('again');
        else if (e.key === '2') rate('hard');
        else if (e.key === '3') rate('good');
        else if (e.key === '4') rate('easy');
      } else {
        if (e.key === '?' || e.key === '/') {
          e.preventDefault();
          setRevealed(true);
        }
      }
      if (e.key === 'f' && currentCard) {
        updateCard(currentCard.id, { flagged: !currentCard.flagged });
      }
      if (e.key === 'p' && currentCard) {
        updateCard(currentCard.id, { priority: !currentCard.priority });
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [currentCard, revealed, rate, updateCard]);

  // Available tags for filter
  const allTags = useMemo(() => {
    const s = new Set();
    cards.forEach(c => (c.tags || []).forEach(t => s.add(t)));
    return Array.from(s).sort();
  }, [cards]);

  // ── Empty / completed states ──────────────────────────────────────────────
  if (!currentCard) {
    const accuracyThis = sessionLog.length > 0
      ? sessionLog.filter(l => l.rating !== 'again').length / sessionLog.length
      : 0;
    return (
      <div className="fade-in max-w-3xl mx-auto">
        <ReviewFilter filter={filter} setFilter={setFilter} cards={cards} allTags={allTags} />
        {sessionLog.length > 0 ? (
          <Card className="p-8 mt-6 text-center">
            <div className="font-serif text-3xl mb-2">Session complete.</div>
            <p className="text-ink/60 dark:text-paper/60 mb-6">
              You reviewed {sessionLog.length} {sessionLog.length === 1 ? 'card' : 'cards'} in {Math.floor(elapsed/60)}m {elapsed%60}s.
              {' '}Accuracy: <strong>{Math.round(accuracyThis * 100)}%</strong>.
            </p>
            <div className="grid grid-cols-4 gap-3 mb-6 max-w-md mx-auto">
              {['again','hard','good','easy'].map((k) => {
                const count = sessionLog.filter(l => l.rating === k).length;
                const colors = { again: 'text-rust', hard: 'text-ochre', good: 'text-moss', easy: 'text-ink dark:text-paper' };
                return (
                  <div key={k} className="text-center">
                    <div className={`font-serif text-2xl font-medium ${colors[k]}`}>{count}</div>
                    <div className="text-xs uppercase tracking-wider text-ink/55 dark:text-paper/55 mt-1">{k}</div>
                  </div>
                );
              })}
            </div>
            <div className="flex gap-2 justify-center">
              <Btn variant="rust" onClick={() => setFilter({ ...filter })}>Review more</Btn>
              <Btn variant="outline" onClick={() => setView('dashboard')}>Back to dashboard</Btn>
            </div>
          </Card>
        ) : (
          <Card className="p-12 mt-6 text-center">
            <div className="font-serif text-3xl mb-2">Nothing to review.</div>
            <p className="text-ink/60 dark:text-paper/60 mb-6">No cards match your filters. Try a different scope, or add cards.</p>
            <div className="flex gap-2 justify-center">
              <Btn variant="rust" onClick={() => setFilter({ scope: 'all', topic: 'all', tag: 'all', difficulty: 'all' })}>All cards</Btn>
              <Btn variant="outline" onClick={() => setView('create')}>+ New card</Btn>
            </div>
          </Card>
        )}
      </div>
    );
  }

  const sessionTotal = remaining + completed;
  const progressPct = sessionTotal > 0 ? (completed / sessionTotal) * 100 : 0;

  return (
    <div className="fade-in max-w-3xl mx-auto">
      {/* Slim filter bar */}
      <ReviewFilter filter={filter} setFilter={setFilter} cards={cards} allTags={allTags} compact />

      {/* Progress + timer */}
      <div className="mt-4 mb-4 flex items-center justify-between gap-3">
        <div className="flex-1 h-1 bg-ink/8 dark:bg-paper/10 rounded-full overflow-hidden">
          <div className="h-full bg-rust transition-all duration-300" style={{ width: `${progressPct}%` }} />
        </div>
        <div className="text-xs text-ink/55 dark:text-paper/55 tabular-nums whitespace-nowrap">
          {completed} / {sessionTotal} · {Math.floor(elapsed/60)}:{String(elapsed%60).padStart(2,'0')}
        </div>
      </div>

      {/* The card */}
      <Card className="overflow-hidden">
        <div className="px-6 py-3 border-b border-ink/8 dark:border-paper/8 flex items-center justify-between gap-3 flex-wrap">
          <div className="flex items-center gap-2 flex-wrap">
            <Pill>{currentCard.topic}</Pill>
            {currentCard.subtopic && <span className="text-xs text-ink/55 dark:text-paper/55">{currentCard.subtopic}</span>}
            <Pill color={currentCard.difficulty === 'Hard' ? 'rust' : currentCard.difficulty === 'Easy' ? 'moss' : 'ochre'}>
              {currentCard.difficulty}
            </Pill>
            {currentCard.priority && <Pill color="rust">★ priority</Pill>}
            {currentCard.flagged && <Pill color="ochre">⚑ flagged</Pill>}
          </div>
          <div className="flex items-center gap-1">
            <button
              onClick={() => updateCard(currentCard.id, { priority: !currentCard.priority })}
              className="p-1.5 rounded hover:bg-paper-2 dark:hover:bg-ink/40 transition text-xs"
              title="Toggle priority (p)"
            >
              {currentCard.priority ? '★' : '☆'}
            </button>
            <button
              onClick={() => updateCard(currentCard.id, { flagged: !currentCard.flagged })}
              className="p-1.5 rounded hover:bg-paper-2 dark:hover:bg-ink/40 transition text-xs"
              title="Flag as confusing (f)"
            >
              ⚑
            </button>
          </div>
        </div>

        <div className="p-6 md:p-10 min-h-[280px] flex flex-col">
          <div className="text-xs uppercase tracking-widest text-ink/45 dark:text-paper/45 mb-3">
            {revealed ? 'Answer' : 'Question'}
          </div>
          <div className="font-serif text-xl md:text-2xl font-medium leading-snug prose-card whitespace-pre-wrap">
            {revealed ? currentCard.answer : currentCard.question}
          </div>
          {revealed && currentCard.notes && (
            <div className="mt-6 pt-4 border-t border-ink/8 dark:border-paper/8 text-sm text-ink/70 dark:text-paper/70 whitespace-pre-wrap">
              <div className="text-xs uppercase tracking-widest text-ink/45 dark:text-paper/45 mb-2">Notes</div>
              {currentCard.notes}
            </div>
          )}
          {revealed && currentCard.tags && currentCard.tags.length > 0 && (
            <div className="mt-5 flex flex-wrap gap-1.5">
              {currentCard.tags.map(t => <Pill key={t}>{t}</Pill>)}
            </div>
          )}
        </div>

        {/* Actions */}
        <div className="border-t border-ink/8 dark:border-paper/8 p-4">
          {!revealed ? (
            <button
              onClick={() => setRevealed(true)}
              className="w-full py-3 bg-ink text-paper dark:bg-paper dark:text-ink rounded-md font-medium hover:bg-ink-soft dark:hover:bg-paper-2 transition"
            >
              Reveal answer <span className="opacity-50 ml-2 text-xs">space</span>
            </button>
          ) : (
            <div className="grid grid-cols-4 gap-2">
              <button onClick={() => rate('again')} className="py-3 px-2 rounded-md bg-rust/10 text-rust hover:bg-rust/20 transition font-medium text-sm">
                Again <div className="text-[10px] opacity-70 font-normal mt-0.5">1 · &lt;1d</div>
              </button>
              <button onClick={() => rate('hard')} className="py-3 px-2 rounded-md bg-ochre/15 text-ochre hover:bg-ochre/25 transition font-medium text-sm">
                Hard <div className="text-[10px] opacity-70 font-normal mt-0.5">2 · {currentCard.reps === 0 ? '1d' : Math.max(1, Math.round((currentCard.interval || 1) * 1.2)) + 'd'}</div>
              </button>
              <button onClick={() => rate('good')} className="py-3 px-2 rounded-md bg-moss/15 text-moss hover:bg-moss/25 transition font-medium text-sm">
                Good <div className="text-[10px] opacity-70 font-normal mt-0.5">3 · {currentCard.reps === 0 ? '1d' : currentCard.reps === 1 ? '3d' : Math.round((currentCard.interval || 1) * (currentCard.ef || 2.5)) + 'd'}</div>
              </button>
              <button onClick={() => rate('easy')} className="py-3 px-2 rounded-md bg-ink/8 dark:bg-paper/10 hover:bg-ink/15 dark:hover:bg-paper/20 transition font-medium text-sm">
                Easy <div className="text-[10px] opacity-70 font-normal mt-0.5">4 · {currentCard.reps === 0 ? '3d' : currentCard.reps === 1 ? '6d' : Math.round((currentCard.interval || 1) * (currentCard.ef + 0.15) * 1.3) + 'd'}</div>
              </button>
            </div>
          )}
        </div>
      </Card>

      <div className="mt-4 text-center text-xs text-ink/45 dark:text-paper/45">
        Shortcuts: <kbd className="px-1.5 py-0.5 rounded bg-ink/5 dark:bg-paper/10 font-mono">space</kbd> reveal · <kbd className="px-1.5 py-0.5 rounded bg-ink/5 dark:bg-paper/10 font-mono">1-4</kbd> rate · <kbd className="px-1.5 py-0.5 rounded bg-ink/5 dark:bg-paper/10 font-mono">f</kbd> flag · <kbd className="px-1.5 py-0.5 rounded bg-ink/5 dark:bg-paper/10 font-mono">p</kbd> priority
      </div>
    </div>
  );
}

function ReviewFilter({ filter, setFilter, cards, allTags, compact }) {
  const dueCount = cards.filter(c => isDue(c)).length;
  const weakCount = cards.filter(c => { const a = accuracy(c); return (a != null && a < 0.7) || c.priority || c.flagged; }).length;
  const priorityCount = cards.filter(c => c.priority).length;
  const flaggedCount = cards.filter(c => c.flagged).length;

  return (
    <div className={compact ? 'mb-0' : 'mb-2'}>
      <div className="flex flex-wrap gap-2 items-center">
        {[
          { key: 'due', label: `Due (${dueCount})` },
          { key: 'weak', label: `Weak (${weakCount})` },
          { key: 'priority', label: `Priority (${priorityCount})` },
          { key: 'flagged', label: `Flagged (${flaggedCount})` },
          { key: 'random', label: 'Random' },
          { key: 'all', label: 'All' },
        ].map(s => (
          <button key={s.key}
            onClick={() => setFilter(f => ({ ...f, scope: s.key }))}
            className={`px-3 py-1.5 rounded-md text-xs font-medium transition ${filter.scope === s.key ? 'bg-ink text-paper dark:bg-paper dark:text-ink' : 'bg-paper-2 dark:bg-ink/40 text-ink/65 dark:text-paper/65 hover:text-ink dark:hover:text-paper'}`}>
            {s.label}
          </button>
        ))}
        <div className="flex-1" />
        <Select
          value={filter.topic}
          onChange={(v) => setFilter(f => ({ ...f, topic: v }))}
          options={[{ value: 'all', label: 'All topics' }, ...TOPICS.map(t => ({ value: t, label: t }))]}
          className="text-xs py-1.5"
        />
        <Select
          value={filter.difficulty}
          onChange={(v) => setFilter(f => ({ ...f, difficulty: v }))}
          options={[{ value: 'all', label: 'Any difficulty' }, ...DIFFICULTIES.map(t => ({ value: t, label: t }))]}
          className="text-xs py-1.5"
        />
        {allTags.length > 0 && (
          <Select
            value={filter.tag}
            onChange={(v) => setFilter(f => ({ ...f, tag: v }))}
            options={[{ value: 'all', label: 'Any tag' }, ...allTags.map(t => ({ value: t, label: t }))]}
            className="text-xs py-1.5"
          />
        )}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// BROWSE
// ─────────────────────────────────────────────────────────────────────────────

function Browse({ cards, updateCard, deleteCard, duplicateCard, setEditingCard, setView }) {
  const [q, setQ] = useState('');
  const [topic, setTopic] = useState('all');
  const [difficulty, setDifficulty] = useState('all');
  const [sort, setSort] = useState('created-desc');
  const [tag, setTag] = useState('all');

  const allTags = useMemo(() => {
    const s = new Set();
    cards.forEach(c => (c.tags || []).forEach(t => s.add(t)));
    return Array.from(s).sort();
  }, [cards]);

  const filtered = useMemo(() => {
    let list = cards;
    if (q.trim()) {
      const needle = q.toLowerCase();
      list = list.filter(c =>
        c.question.toLowerCase().includes(needle) ||
        c.answer.toLowerCase().includes(needle) ||
        c.topic.toLowerCase().includes(needle) ||
        (c.subtopic || '').toLowerCase().includes(needle) ||
        (c.tags || []).some(t => t.toLowerCase().includes(needle))
      );
    }
    if (topic !== 'all') list = list.filter(c => c.topic === topic);
    if (difficulty !== 'all') list = list.filter(c => c.difficulty === difficulty);
    if (tag !== 'all') list = list.filter(c => (c.tags || []).includes(tag));

    const sorted = [...list];
    if (sort === 'created-desc') sorted.sort((a,b) => b.createdAt - a.createdAt);
    else if (sort === 'created-asc') sorted.sort((a,b) => a.createdAt - b.createdAt);
    else if (sort === 'due') sorted.sort((a,b) => a.due - b.due);
    else if (sort === 'accuracy') sorted.sort((a,b) => (accuracy(a) ?? 1) - (accuracy(b) ?? 1));
    else if (sort === 'reviews') sorted.sort((a,b) => (b.totalReviews||0) - (a.totalReviews||0));
    return sorted;
  }, [cards, q, topic, difficulty, tag, sort]);

  return (
    <div className="fade-in space-y-4">
      <div className="flex flex-col md:flex-row md:items-end md:justify-between gap-3">
        <div>
          <h1 className="font-serif text-3xl md:text-4xl font-medium">Browse</h1>
          <p className="text-ink/60 dark:text-paper/60 text-sm mt-1">{filtered.length} of {cards.length} cards</p>
        </div>
        <Btn variant="rust" onClick={() => { setEditingCard(null); setView('create'); }}>+ New card</Btn>
      </div>

      <Card className="p-4">
        <div className="flex flex-wrap gap-2">
          <Input
            placeholder="Search question, answer, topic, tag…"
            value={q}
            onChange={(e) => setQ(e.target.value)}
            className="flex-1 min-w-[200px]"
          />
          <Select value={topic} onChange={setTopic} options={[{value:'all',label:'All topics'}, ...TOPICS.map(t=>({value:t,label:t}))]} />
          <Select value={difficulty} onChange={setDifficulty} options={[{value:'all',label:'Any difficulty'}, ...DIFFICULTIES.map(t=>({value:t,label:t}))]} />
          {allTags.length > 0 && <Select value={tag} onChange={setTag} options={[{value:'all',label:'Any tag'}, ...allTags.map(t=>({value:t,label:t}))]} />}
          <Select value={sort} onChange={setSort} options={[
            { value: 'created-desc', label: 'Newest first' },
            { value: 'created-asc', label: 'Oldest first' },
            { value: 'due', label: 'Due soonest' },
            { value: 'accuracy', label: 'Lowest accuracy' },
            { value: 'reviews', label: 'Most reviewed' },
          ]} />
        </div>
      </Card>

      <div className="space-y-2">
        {filtered.length === 0 ? (
          <Card className="p-12 text-center text-ink/55 dark:text-paper/55">
            No cards match. <button onClick={() => { setQ(''); setTopic('all'); setDifficulty('all'); setTag('all'); }} className="text-rust underline ml-1">Clear filters</button>
          </Card>
        ) : (
          filtered.map(c => (
            <CardRow
              key={c.id} card={c}
              onEdit={() => { setEditingCard(c); setView('create'); }}
              onDelete={() => { if (confirm('Delete this card?')) deleteCard(c.id); }}
              onDuplicate={() => duplicateCard(c.id)}
              onTogglePriority={() => updateCard(c.id, { priority: !c.priority })}
              onToggleFlag={() => updateCard(c.id, { flagged: !c.flagged })}
            />
          ))
        )}
      </div>
    </div>
  );
}

function CardRow({ card, onEdit, onDelete, onDuplicate, onTogglePriority, onToggleFlag }) {
  const [expanded, setExpanded] = useState(false);
  const acc = accuracy(card);
  return (
    <Card className="overflow-hidden">
      <button onClick={() => setExpanded(!expanded)} className="w-full text-left px-4 py-3 hover:bg-paper-2/50 dark:hover:bg-ink/40 transition">
        <div className="flex items-start gap-3">
          <div className="flex-1 min-w-0">
            <div className="flex items-center gap-1.5 flex-wrap mb-1.5">
              <Pill>{card.topic}</Pill>
              {card.priority && <Pill color="rust">★</Pill>}
              {card.flagged && <Pill color="ochre">⚑</Pill>}
              <Pill color={card.difficulty === 'Hard' ? 'rust' : card.difficulty === 'Easy' ? 'moss' : 'ochre'}>
                {card.difficulty}
              </Pill>
              {(card.tags || []).slice(0, 3).map(t => <Pill key={t}>{t}</Pill>)}
            </div>
            <div className="font-serif text-base font-medium leading-snug line-clamp-2">{card.question}</div>
          </div>
          <div className="text-xs text-ink/50 dark:text-paper/50 text-right flex-shrink-0 hidden sm:block">
            <div>Due {formatRelative(card.due)}</div>
            {acc != null && <div>{Math.round(acc*100)}% · {card.totalReviews}r</div>}
          </div>
        </div>
      </button>
      {expanded && (
        <div className="px-4 pb-4 pt-2 border-t border-ink/5 dark:border-paper/5 fade-in">
          <div className="text-xs uppercase tracking-widest text-ink/45 dark:text-paper/45 mb-1.5">Answer</div>
          <div className="text-sm text-ink/85 dark:text-paper/85 whitespace-pre-wrap leading-relaxed">{card.answer}</div>
          {card.notes && (
            <>
              <div className="text-xs uppercase tracking-widest text-ink/45 dark:text-paper/45 mt-3 mb-1.5">Notes</div>
              <div className="text-sm text-ink/70 dark:text-paper/70 whitespace-pre-wrap">{card.notes}</div>
            </>
          )}
          <div className="flex items-center gap-2 mt-3 flex-wrap">
            <Btn variant="outline" onClick={(e) => { e.stopPropagation(); onEdit(); }}>Edit</Btn>
            <Btn variant="ghost" onClick={(e) => { e.stopPropagation(); onDuplicate(); }}>Duplicate</Btn>
            <Btn variant="ghost" onClick={(e) => { e.stopPropagation(); onTogglePriority(); }}>{card.priority ? 'Unstar' : 'Star priority'}</Btn>
            <Btn variant="ghost" onClick={(e) => { e.stopPropagation(); onToggleFlag(); }}>{card.flagged ? 'Unflag' : 'Flag confusing'}</Btn>
            <div className="flex-1" />
            <Btn variant="danger" onClick={(e) => { e.stopPropagation(); onDelete(); }}>Delete</Btn>
          </div>
        </div>
      )}
    </Card>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// FORMULA BUILDER
// A collapsible panel of CFA-relevant symbols and formula templates.
// Inserts text at the cursor of the currently-targeted field.
// ─────────────────────────────────────────────────────────────────────────────

const FORMULA_GREEK_LOWER = [
  { c: 'α', n: 'alpha' }, { c: 'β', n: 'beta' }, { c: 'γ', n: 'gamma' },
  { c: 'δ', n: 'delta' }, { c: 'ε', n: 'epsilon' }, { c: 'ζ', n: 'zeta' },
  { c: 'η', n: 'eta' }, { c: 'θ', n: 'theta' }, { c: 'κ', n: 'kappa' },
